# PIPE → pr-search private 리스너 앞의 HAProxy 예시 (CR-112). 운영에 적용하지 않았다.
#
# **L4 passthrough만 지원한다** (ADR-025, CONTRACT_DIFF D-02). HAProxy는 TLS를 끝내지 않고 바이트를 그대로
# 넘긴다. client 인증서 검증은 search-api가 직접 한다. `mode http`로 TLS를 끝내고 X-SSL-Client-* 헤더를
# 넘기는 형상은 pr-search가 그 헤더를 읽지 않으므로 동작하지 않는다 — 의도된 것이다.

frontend pipe_search_integration
    bind <private-vip>:3443
    mode tcp
    option tcplog
    # PIPE 서버의 사내 주소만 받는다 (추가 방어 — mTLS를 대신하지 않는다).
    acl pipe_servers src <pipe-server-cidr>
    tcp-request connection reject if !pipe_servers
    default_backend pr_search_private

backend pr_search_private
    mode tcp
    # health check는 TCP 연결만 본다. private 리스너에는 인증 없는 경로가 없다.
    option tcp-check
    server search-api-1 <search-api-host>:3443 check
