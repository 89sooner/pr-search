            $ref: '#/components/schemas/SourceHistory'
    SourceDiffOk:
      description: 원본과 같은 본문 (`correlation_id` 키가 없다).
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
