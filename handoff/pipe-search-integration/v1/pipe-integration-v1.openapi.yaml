          schema:
            $ref: '#/components/schemas/SourceFile'
    SourceRateLimited:
      description: GHE rate limit. 원본 봉투(`SOURCE_RATE_LIMITED`)이며 `Retry-After`가 붙을 수 있다. 즉시 재시도하지 않는다.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SourceErrorResponse'
    ReadRepositoriesError:
      description: 연동 고유 실패(PsiErrorResponse) 또는 원본 조회의 실패(RepositoriesErrorResponse).
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReadRepositoriesError'
    ReadSearchError:
      description: 연동 고유 실패(PsiErrorResponse) 또는 원본 조회의 실패(SearchErrorResponse).
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReadSearchError'
    ReadResolveError:
      description: 연동 고유 실패(PsiErrorResponse) 또는 원본 조회의 실패(ResolveErrorResponse).
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
