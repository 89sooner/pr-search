          pattern: '^[0-9a-fA-F]{40}$'
        path:
          type: string
        commits:
          type: array
          items:
            $ref: '#/components/schemas/SourceHistoryCommit'
        next_page:
          type: [integer, 'null']
          description: >-
            GitHub Link 헤더가 알린 다음 페이지. 없으면 null.
        pull_requests_unavailable:
          const: true

    SourceHistoryCommit:
      type: object
      description: >-
        History 행. author는 GitHub 로그인, 없으면 커밋 작성자 이름, 그것도 없으면 'Unknown'. date는 committer 날짜(없으면
        null). pull_request_numbers는 배열(빈 배열 포함)이면 확정, null이면 미확정이다. 배열은 중복 없이 오름차순이다.
        (근거: packages/contracts/src/source.ts:4-6, apps/search-api/src/source/service.ts:18,
        apps/search-api/src/source/service.ts:74, apps/search-api/src/source/service.ts:95-99)
      required: [sha, parents, message, author, date, pull_request_numbers]
      additionalProperties: false
