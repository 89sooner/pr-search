        seq_epoch·sequence_space·pull_requests·url·correlation_id다. 나머지는 put()이 문서에 값이 있을 때만 넣는다(보강 전
        커밋에는 message·author 등이 없다). 커밋 보강은 author·committer에 null을 쓸 수 있다. pull_requests가 비면
        reason_code no_pull_request가 붙는다 — 직접 푸시라는 뜻이 아니라 투영이 PR 번호를 아직 잇지 못했다는 뜻이다.
        (근거: apps/search-api/src/resolve/detail.ts:199-284, apps/search-api/src/resolve/routes.ts:304,
