          type: string
          pattern: '^[0-9a-fA-F]{40}$'
        path:
          type: string
          description: >-
            요청 path. 루트면 ''.
        entries:
          type: array
          maxItems: 5000
          items:
            $ref: '#/components/schemas/SourceEntry'
        truncated:
          type: boolean

    SourceEntry:
      type: object
      description: >-
        트리 항목 하나. kind는 git 트리 type·mode로 정한다(tree → directory, commit → submodule, mode 120000 → symlink, 그 밖
        file). size는 GitHub가 주지 않으면(디렉터리 등) null. path는 요청 path를 앞에 붙인 전체 경로, name은 항목 이름이다.
        (근거: packages/contracts/src/source.ts:2, apps/search-api/src/source/service.ts:31-33)
      required: [path, name, sha, kind, size]
      additionalProperties: false
      properties:
        path:
          type: string
        name:
          type: string
        sha:
          type: string
        kind:
          type: string
          enum: [directory, file, symlink, submodule]
        size:
          type: [integer, 'null']

    SourceHistory:
      type: object
      description: >-
        GET /api/v1/source/{repository}/history 200 본문(correlation_id 없음). pull_requests_unavailable은 PR 연결 조회를
        건너뛰었거나(ES 미배선) 실패했을 때만 true로 나타나고, 그때 모든 행의 pull_request_numbers가 null이다. 정상이면 키가
        없다.
        (근거: packages/contracts/src/source.ts:7, apps/search-api/src/source/service.ts:87-103)
      required: [repository, revision, path, commits, next_page]
      additionalProperties: false
      properties:
