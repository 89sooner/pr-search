      x-operation-id: read.source.history
      x-api-id: API-INT-012
      x-auth: mtls+grant
      x-original:
        api_id: API-SRC-002
        method: GET
        path: /api/v1/source/{repository}/history
      tags: [read]
      summary: 경로 이력 (원본 API-SRC-002 실행)
      description: 페이지마다 커밋 50개. 행의 `pull_request_numbers`는 배열(확정)·`null`(미확정)이고, PR 연결 조회가 실패하면 `pull_requests_unavailable`이 참이다.
      parameters:
        - $ref: '#/components/parameters/UpstreamCorrelationId'
        - $ref: '#/components/parameters/Repository'
        - $ref: '#/components/parameters/SourceRef'
        - $ref: '#/components/parameters/SourcePath'
        - name: page
          in: query
          required: false
          description: 1~1000, 기본 1. 빈 값·정수 아님은 400.
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/SourceHistoryOk'
        '429':
          $ref: '#/components/responses/SourceRateLimited'
        default:
          $ref: '#/components/responses/ReadSourceError'

  /internal/integrations/pipe/v1/read/source/{repository}/diff:
    get:
      operationId: readSourceDiff
      x-operation-id: read.source.diff
      x-api-id: API-INT-013
      x-auth: mtls+grant
      x-original:
        api_id: API-SRC-004
        method: GET
        path: /api/v1/source/{repository}/diff
      tags: [read]
      summary: 변경 비교 (원본 API-SRC-004 실행)
      description: '`pr`과 `commit` 중 정확히 하나. 페이지마다 파일 100개, 30페이지까지. PR 비교는 merge-base 기준이며 조회 전후 base/head가 움직이면 원본의 `SOURCE_CHANGED` 409다.'
      parameters:
        - $ref: '#/components/parameters/UpstreamCorrelationId'
        - $ref: '#/components/parameters/Repository'
        - name: pr
          in: query
          required: false
          description: PR 번호 1~2147483647. `commit`과 정확히 하나.
          schema:
            type: string
        - name: commit
          in: query
          required: false
          description: 40자 hex. `pr`과 정확히 하나.
          schema:
            type: string
        - name: page
          in: query
          required: false
          description: 1~30, 기본 1.
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/SourceDiffOk'
        '429':
          $ref: '#/components/responses/SourceRateLimited'
        default:
          $ref: '#/components/responses/ReadSourceError'

  /internal/integrations/pipe/v1/read/source/{repository}/file:
    get:
      operationId: readSourceFile
      x-operation-id: read.source.file
      x-api-id: API-INT-014
      x-auth: mtls+grant
      x-original:
        api_id: API-SRC-003
        method: GET
        path: /api/v1/source/{repository}/file
      tags: [read]
      summary: 특정 리비전의 파일 (원본 API-SRC-003 실행)
      description: '256KiB·4000줄·UTF-8 한도. 넘으면 200 `status: too_large`다. 없는 path는 revision이 실제로 있을 때만 `missing`이다.'
      parameters:
        - $ref: '#/components/parameters/UpstreamCorrelationId'
        - $ref: '#/components/parameters/Repository'
        - name: path
          in: query
          required: true
          description: 파일 경로. 2048자 이하, 제어 문자·역슬래시·`.`·`..`·빈 조각 금지, `/`로 시작·끝 금지.
          schema:
            type: string
        - name: revision
          in: query
          required: true
          description: 40자 hex 커밋 SHA.
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/SourceFileOk'
        '429':
          $ref: '#/components/responses/SourceRateLimited'
        default:
          $ref: '#/components/responses/ReadSourceError'

components:
  securitySchemes:
    mutualTLS:
      type: mutualTLS
      description: |
        private 리스너가 직접 끝내는 TLS의 client 인증서. 정책 파일의 `tls_client`(SAN 정확 일치 또는 leaf DER의 SHA-256
        지문)에 등록된 인증서만 client로 인정한다. TLS를 끝내는 프록시와 전달 헤더는 지원하지 않는다.
    grant:
      type: http
      scheme: bearer
      bearerFormat: psig1_ + 32바이트 난수의 base64url (43자)
      description: '`/auth/exchange`가 발급한 검색 grant. 발급 인증서에 결속되며 수명은 300초 이하다.'

  parameters:
    UpstreamCorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: PIPE가 만든 상관 ID. UUID 형식일 때만 pr-search 이벤트 기록(`upstream_correlation_id`)에 남기고 응답으로 되돌려 보내지 않는다. 그 밖의 값은 버린다.
      schema:
        type: string
    Repository:
      name: repository
      in: path
      required: true
      description: |
        `owner%2Fname` 한 조각(`/`를 `%2F` 하나로 인코딩). 풀린 값은 `^[A-Za-z0-9._-]{1,100}/[A-Za-z0-9._-]{1,100}$`여야
        하고 `.`·`..` 조각은 거절한다. 이중 인코딩(`%252F`)·깨진 percent-encoding·제어 문자는 400 `INVALID_REQUEST`다.
        풀린 값이 100자를 넘으면 경로가 맞지 않아 404다(CONTRACT_DIFF D-11).
      schema:
        type: string
    SourceRef:
      name: ref
      in: query
      required: false
      description: 브랜치·태그·40자 SHA. 빈 값은 저장소 기본 브랜치. 1~255자, 공백 이하 문자·0x7F·`~^:?*[\`·`..`·`@{` 금지, `-`로 시작 금지.
      schema:
        type: string
    SourcePath:
      name: path
      in: query
      required: false
      description: 빈 값은 루트. 2048자 이하, 제어 문자·역슬래시·`.`·`..`·빈 조각 금지, `/`로 시작·끝 금지.
      schema:
        type: string
    SourceRevision:
      name: revision
      in: query
      required: false
      description: 40자 hex. 있으면 그 커밋에 고정한다.
      schema:
        type: string

  headers:
    XCorrelationId:
      description: 이 요청에 서버가 만든 UUID. 본문 `correlation_id`와 같다.
      schema:
        type: string
        format: uuid
    CacheControl:
      description: 언제나 `private, no-store`.
      schema:
        type: string
        const: private, no-store
    RetryAfter:
      description: GHE가 알려 준 재시도까지의 초. 알려 주지 않았으면 없다.
      schema:
        type: string

  responses:
    PsiError:
      description: 연동 고유 실패. 상태·재시도 가능 여부·문구는 코드마다 고정이다(`PsiErrorCode`의 `x-psi-errors`).
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PsiErrorResponse'
    RepositoriesOk:
      description: 원본과 같은 본문.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RepositoryListResponse'
    SearchOk:
      description: 원본과 같은 본문 — 정상 결과 또는 epoch_stale.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SearchResponseBody'
    ResolveOk:
      description: 원본과 같은 본문.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResolveResponse'
    MergeNumberResolveOk:
      description: 원본과 같은 본문 — 해석 결과 또는 epoch_stale.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MergeNumberResolveResponse'
    PullRequestOk:
      description: 원본과 같은 본문.
