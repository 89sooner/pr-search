        reviewers:
          type: array
          items:
            type: string
        approved_by:
          type: array
          items:
            type: string
        state:
          type: string
        merged_at:
          type: [string, 'null']
        merge_commit_sha:
          type: [string, 'null']
        url:
          type: string
          description: >-
            `/pr/{repository}/{pr_number}`.

    # ================================================================================================= [5] M 번호 해석
    MergeNumberResolveResponse:
      description: >-
        GET /api/v1/merge-numbers/resolve 200 본문은 두 모양 중 하나다. 요청 seq_epoch가 현재 에폭과 다르면 값을 계산하지
        않은 MergeNumberResolveEpochStaleResponse, 그 밖은 MergeNumberResolution. 둘 다 routes가 correlation_id를 덧붙인다.
        (근거: apps/search-api/src/sequence/routes.ts:340-341, apps/search-api/src/sequence/merge-numbers.ts:254-265,
        apps/search-api/src/sequence/merge-numbers.ts:352-363)
      oneOf:
        - $ref: '#/components/schemas/MergeNumberResolution'
        - $ref: '#/components/schemas/MergeNumberResolveEpochStaleResponse'

    MergeNumberResolution:
      type: object
      description: >-
        M 번호 ↔ PR 해석 결과. 모든 키가 언제나 있다. 정본 값은 한 read snapshot에서 읽고, 색인 반영 상태만 스냅숏 밖에서
        ES로 읽는다(실패하면 unknown). 이 경로는 채번 대상 브랜치와 정본 행을 먼저 확인하므로 not_applicable·
        mnumber_read_failed에 닿지 않는다. merge_seq는 정본 행 중 merge_seq가 가장 작은 행의 값이고, M 필드는 번호가 있는 행을
        우선해 고른다 — 같은 PR에 행이 둘(이중 squash SHA)이면 둘이 다른 행에서 올 수 있다.
        (근거: apps/search-api/src/sequence/merge-numbers.ts:297-303, apps/search-api/src/sequence/merge-numbers.ts:324-364,
        apps/search-api/src/sequence/merge-number-view.ts:71-101, packages/db/src/repositories/merge-sequence.ts:687)
      required:
        - sequence_space
        - seq_epoch
        - sequence_state
        - epoch_stale
        - pr_number
        - merge_seq
        - merge_number
        - merge_number_state
        - merge_number_reason
        - merge_number_epoch
        - merge_number_projection_state
        - correlation_id
      additionalProperties: false
      allOf:
        - $ref: '#/components/schemas/MergeNumberRules'
      properties:
        sequence_space:
          type: string
          description: >-
            요청 repository를 가른 owner/name과 base_branch로 만든 `owner/name@branch`.
            (근거: apps/search-api/src/sequence/merge-numbers.ts:252)
        seq_epoch:
          type: integer
          minimum: 1
        sequence_state:
          $ref: '#/components/schemas/SequenceSpaceState'
        epoch_stale:
          const: false
        pr_number:
          type: integer
          minimum: 1
          maximum: 2147483647
        merge_seq:
          type: integer
        merge_number:
          anyOf:
            - $ref: '#/components/schemas/MergeNumberText'
            - type: 'null'
        merge_number_state:
          $ref: '#/components/schemas/MergeNumberState'
        merge_number_reason:
          anyOf:
            - $ref: '#/components/schemas/MergeNumberReason'
            - type: 'null'
        merge_number_epoch:
          type: [integer, 'null']
          minimum: 1
        merge_number_projection_state:
          $ref: '#/components/schemas/MergeNumberProjectionState'
        correlation_id:
          $ref: '#/components/schemas/CorrelationId'

    MergeNumberResolveEpochStaleResponse:
      type: object
      description: >-
        요청 seq_epoch가 현재 에폭과 다를 때의 200 본문. 값을 계산하지 않으므로 sequence_state·pr_number·merge_seq·M 키가
        없다(검색의 stale 모양과 달리 공간 상태도 싣지 않는다). seq_epoch는 현재 에폭이다.
        (근거: apps/search-api/src/sequence/merge-numbers.ts:254-265, apps/search-api/src/sequence/routes.ts:340-341)
      required: [sequence_space, seq_epoch, epoch_stale, requested_seq_epoch, correlation_id]
      additionalProperties: false
      properties:
        sequence_space:
          type: string
        seq_epoch:
          type: integer
          minimum: 1
        epoch_stale:
          const: true
        requested_seq_epoch:
          type: integer
          minimum: 1
        correlation_id:
          $ref: '#/components/schemas/CorrelationId'

    # ================================================================================================= [6] 소스 탐색
    SourceTree:
      type: object
      description: >-
        GET /api/v1/source/{repository}/tree 200 본문(correlation_id 없음). ref는 요청 ref, 없으면 기본 브랜치 이름이고
        tree_sha로 하위 디렉터리를 펼칠 때는 요청 ref 또는 revision이다. revision은 고정된 40자 커밋 SHA다. entries는 최대
        5000개이며 디렉터리 먼저, 이름 순이다. GitHub가 잘랐거나 5000개를 넘으면 truncated true.
        (근거: packages/contracts/src/source.ts:3, apps/search-api/src/source/service.ts:20-35)
