        GET /api/v1/source/{repository}/file 200 본문(correlation_id 없음). 미리보기를 못 해도 200이며 status와 reason이 그
        이유를 말한다. status가 text일 때만 text가 문자열이고 reason이 null이다. 그 밖(missing·binary·too_large·unsupported)은
        text가 null이고 reason이 영어 문장이다. missing은 그 revision에 경로가 없을 때이며 size·sha도 null이다. 크기 상한
        256 KiB·4000줄.
        (근거: packages/contracts/src/source.ts:8, apps/search-api/src/source/service.ts:8-9, apps/search-api/src/source/service.ts:104-124)
      required: [repository, revision, path, status, text, size, sha, reason]
