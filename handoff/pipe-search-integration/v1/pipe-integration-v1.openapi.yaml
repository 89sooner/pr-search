# =====================================================================================================================
# PR Search — PIPE 연동 private API (PSI-1.0) · OpenAPI 3.1
# =====================================================================================================================
# 무엇인가: PIPE 서버만 부르는 pr-search private 리스너의 계약이다 (CR-112 / FR-INT-001 / ADR-025).
#   공개 리스너·web 프록시에는 이 경로들이 없다. 기본 꺼짐이며 켠 배포에서만 리스너가 선다.
# 정본 관계:
#   - 경로 목록: apps/search-api/src/integrations/pipe/operations.ts 의 INTEGRATION_OPERATIONS
#   - 연동 오류 코드·상태·재시도 가능·문구: apps/search-api/src/integrations/pipe/errors.ts 의 PSI_ERRORS
#   - 조회 성공 본문과 원본 오류 본문: 원본 /api/v1/* 코드 (components.schemas 뒤쪽의 「원본 조회 DTO」 절)
#   계약 시험(apps/search-api/src/integrations/pipe/contract.test.ts)이 이 파일·코드·operation-map.json·examples·
#   manifest.json을 대조하고, 통합 시험(apps/search-api/integration/integrations/pipe/openapi.test.ts)이 실제 mTLS로 받은
#   응답 본문을 이 파일의 스키마로 검증한다. 둘 중 하나라도 어긋나면 시험이 깨진다.
# 오류 모양은 둘이다 (CONTRACT_DIFF D-09):
#   - 연동 고유 실패(mTLS·assertion·grant·identity·입력 거절·저장소 장애): PsiErrorResponse — `retryable`이 있다.
#   - 원본 조회의 실패(질의 문법·커서·source·에폭·범위 밖 404·조회 중 503): 원본 봉투 — `retryable`이 없다.
#   조회 응답의 오류 스키마는 두 모양의 oneOf다. `error` 객체가 양쪽 모두 닫혀 있어 한 본문이 둘에 동시에 맞지 않는다.
# 체크섬: handoff manifest.json의 contract_checksum이 이 파일과 operation-map.json의 LF 정규화 SHA-256을 묶는다.
# =====================================================================================================================
openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: PR Search — PIPE Search Integration (private)
  version: PSI-1.0
  summary: PIPE 서버가 사용자 신원을 위임해 pr-search의 읽기 전용 조회 10종을 쓰는 서버 간 계약
  description: |
    ## 자격

    - **mTLS**: 모든 요청은 private 리스너의 TLS 핸드셰이크에서 client 인증서를 낸다. 인증서가 없거나 신뢰 CA가
      발급하지 않았으면 HTTP 응답 없이 핸드셰이크가 실패한다. 신뢰 CA가 발급했지만 정책에 없는 인증서는 401
      `CLIENT_AUTH_FAILED`다. 프록시 전달 헤더(`X-SSL-Client-*` 등)는 읽지 않는다 — TLS passthrough만 지원한다.
    - **assertion**: `/auth/exchange`·`/auth/revoke-context`의 본문. RS256 compact JWS, 헤더는 `alg`·`typ`·`kid` 셋만,
      `typ`은 정확히 `pipe-user-assertion+jwt`, claim 12개(`iss`·`aud`(문자열 하나)·`sub`·`client_id`·`purpose`·
      `profile`·`auth_context_id`·`auth_expires_at`·`iat`·`nbf`·`exp`·`jti`)가 모두 필수이고 그 밖의 claim은 거절한다.
      `exp - iat`는 60초 이하, 시계 오차 5초, 길이 8192자 이하. 상세 규칙과 기대 결과는 `conformance/vectors.json`.
    - **grant**: `Authorization: Bearer psig1_…`. 발급에 쓴 client 인증서에 묶이며(다른 인증서면 401
      `GRANT_BINDING_MISMATCH`) 수명은 `min(발급 + 300초, auth_expires_at, client 인증서 만료)`다. 연장하지 않는다.

    ## 모든 응답

    `Cache-Control: private, no-store`, `Pragma: no-cache`, `X-Content-Type-Options: nosniff`, 서버가 만든
    `X-Correlation-Id`(UUID, 본문 `correlation_id`와 같은 값 — source 성공 본문에는 `correlation_id` 키가 없다).
    `Set-Cookie`는 없다. `Cookie` 헤더가 있는 요청은 400 `INVALID_REQUEST`다. HEAD·OPTIONS와 목록 밖 경로는 404다.

    ## 조회 (read.*)

    원본 `/api/v1/*`의 실행 함수를 그대로 부른다. 주체는 grant의 canonical 사용자, 접근 범위는 그 사용자의 기존
    범위와 client 허용 목록의 교집합(명시적 저장소 목록)이다. 연동 계층은 원본보다 엄격하다: 같은 query key의 중복,
    목록에 없는 key, 깨진 percent-encoding·C0 제어 문자·`#`, 경로 파라미터 `{repository}`의 이중 인코딩(`%252F`)·
    dot segment는 400 `INVALID_REQUEST`다(CONTRACT_DIFF D-03). query 값의 뜻은 원본 그대로다 — 예를 들어 식별자
    해석의 `repository` 힌트는 형식이 틀리면 조용히 버린다. 연동 커서는 client와 사용자에 결속되어 공개 경로 커서와
    섞이지 않는다.
servers:
  - url: https://{host}:{port}
    description: search-api private 리스너 (mTLS 필수). 실제 주소는 운영 입력이다 (PENDING_OPERATOR_INPUT).
    variables:
      host:
        default: pr-search-integration.internal.example
      port:
        default: '3443'
security:
  - mutualTLS: []
    grant: []
tags:
  - name: auth
    description: grant 발급과 회수 (연동 전용)
  - name: context
    description: 검색 사용자 문맥 (연동 전용)
  - name: read
    description: 원본 조회 10종을 그대로 실행한다

paths:
  /internal/integrations/pipe/v1/auth/exchange:
    post:
      operationId: authExchange
      x-operation-id: auth.exchange
      x-api-id: API-INT-001
      x-auth: mtls+assertion
      x-original: null
      tags: [auth]
      summary: 검색 grant 발급
      description: |
        처리 순서: client 인증서 → 쿠키·`Authorization` 거절 → 본문 모양(JSON, 16KiB 이하) → 서명·claim(`purpose: grant`)
        → 서명 키 긴급 회수 → `jti` 원자 소비(재사용이면 401 `ASSERTION_REPLAYED`) → 로그인 문맥 회수(403
        `CONTEXT_REVOKED`) → identity binding·정본 사용자·GHE의 현재 숫자 ID(403 `IDENTITY_BINDING_REQUIRED`·
        `IDENTITY_DISABLED`, 409 `IDENTITY_BINDING_CONFLICT`) → 접근 범위 1회 조회(실패 503 `PERMISSION_UNAVAILABLE`,
        0개 저장소는 성공) → grant 저장. 재생 방지·grant 저장소 장애는 503 `AUTH_STORE_UNAVAILABLE`이다.
        수명이 1초 미만이면 발급하지 않고 401 `ASSERTION_INVALID`다.
      security:
        - mutualTLS: []
      parameters:
        - $ref: '#/components/parameters/UpstreamCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssertionRequest'
      responses:
        '200':
          description: 발급했다.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeResponse'
        default:
          $ref: '#/components/responses/PsiError'

  /internal/integrations/pipe/v1/auth/revoke:
    post:
      operationId: authRevoke
      x-operation-id: auth.revoke
      x-api-id: API-INT-002
      x-auth: mtls+grant-optional
      x-original: null
      tags: [auth]
      summary: grant 하나 회수 (멱등)
      description: |
        `Authorization: Bearer <grant>`가 가리키는 grant를 회수한다. **자기 client의 grant만** 바뀐다. 형식이 틀렸든,
        없든, 다른 client의 것이든, 이미 회수됐든 같은 200 본문이다 — 토큰의 존재를 알려 주지 않는다.
        `Authorization` 헤더 자체가 없으면 400 `INVALID_REQUEST`다. 본문은 없거나 `{}`이며, 본문 없이 보낼 때는
        `Content-Type`을 싣지 않는다(CONTRACT_DIFF D-06).
      security:
        - mutualTLS: []
          grant: []
      parameters:
        - $ref: '#/components/parameters/UpstreamCorrelationId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyRequest'
      responses:
        '200':
          description: 회수했거나 회수할 것이 없었다 (구분하지 않는다).
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevokeResponse'
        default:
          $ref: '#/components/responses/PsiError'

  /internal/integrations/pipe/v1/auth/revoke-context:
    post:
      operationId: authRevokeContext
      x-operation-id: auth.revoke_context
      x-api-id: API-INT-003
      x-auth: mtls+assertion
      x-original: null
      tags: [auth]
      summary: 로그인 문맥 회수
      description: |
        새 assertion(`purpose: revoke_context`)의 `(iss, sub, auth_context_id)` 문맥을 회수한다. 회수 표식은 PostgreSQL에
        남고 그 문맥의 grant가 모두 죽으며, 같은 문맥의 발급은 이후 403 `CONTEXT_REVOKED`다. 이 호출은 binding을
        요구하지 않는다. 지난 `auth_expires_at`도 받는다(발급에는 받지 않는다). 긴급 회수된 서명 키로 서명했으면 403
        `CLIENT_DISABLED`다. 이미 회수된 문맥이면 처음 회수 시각을 돌려준다.
      security:
        - mutualTLS: []
      parameters:
        - $ref: '#/components/parameters/UpstreamCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssertionRequest'
      responses:
        '200':
          description: 문맥을 회수했다 (이미 회수되어 있었으면 처음 회수 시각).
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevokeContextResponse'
        default:
          $ref: '#/components/responses/PsiError'

  /internal/integrations/pipe/v1/context:
    get:
      operationId: getContext
      x-operation-id: context
      x-api-id: API-INT-004
      x-auth: mtls+grant
      x-original: null
      tags: [context]
      summary: 검색 사용자 문맥
      description: |
        grant의 검색 사용자 문맥이다. `identity.ghe_login`은 pr-search 정본(`app_user.login`)의 현재 값이다. 브라우저용
        `/api/pr-search/v1/context`와 `context_key`는 PIPE BFF가 만든다 — pr-search는 만들지 않는다(CONTRACT_DIFF D-08).
        query key를 받지 않는다.
      parameters:
        - $ref: '#/components/parameters/UpstreamCorrelationId'
      responses:
        '200':
          description: grant가 유효하다.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationContextResponse'
        default:
          $ref: '#/components/responses/PsiError'

  /internal/integrations/pipe/v1/read/repositories:
    get:
      operationId: readRepositories
      x-operation-id: read.repositories
      x-api-id: API-INT-005
      x-auth: mtls+grant
      x-original:
        api_id: API-ING-002
        method: GET
        path: /api/v1/repositories
      tags: [read]
      summary: 저장소 목록 (원본 API-ING-002 실행)
      description: |
        교집합이 빈 사용자는 200 `items: []`다(CONTRACT_DIFF D-01). 접근 범위 확인 실패는 503
        `PERMISSION_UNAVAILABLE`(연동 봉투)이다 — 원본 공개 경로는 같은 경우 500을 내는 결함이 있다(CONTRACT_DIFF D-20).
      parameters:
        - $ref: '#/components/parameters/UpstreamCorrelationId'
        - name: limit
          in: query
          required: false
          description: 정수 1~100, 기본 50. 없음·빈 값은 50. 범위 밖·정수 아님은 400 `INVALID_PARAMETER`(절삭하지 않는다).
          schema:
            type: string
        - name: cursor
          in: query
          required: false
          description: 앞 응답의 `next_cursor`. 빈 값은 첫 페이지. trim하지 않는다. 쓸 수 없으면 400 `CURSOR_INVALID`, 범위·조건이 바뀌었으면 400 `CURSOR_QUERY_MISMATCH`.
          schema:
            type: string
        - name: repository
          in: query
          required: false
          description: '`owner/name` 완전 일치 필터. 빈 값은 필터 없음. 일치 없음과 볼 수 없음은 둘 다 200 `items: []`다.'
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/RepositoriesOk'
        default:
          $ref: '#/components/responses/ReadRepositoriesError'

  /internal/integrations/pipe/v1/read/search:
    get:
      operationId: readSearch
      x-operation-id: read.search
      x-api-id: API-INT-006
      x-auth: mtls+grant
      x-original:
        api_id: API-SRCH-004
        method: GET
        path: /api/v1/search
      tags: [read]
      summary: 검색 (원본 API-SRCH-004 실행)
      description: |
        검사 순서는 원본과 같다: sort → q 파싱 → 접근 범위 → `seq:` 바인딩(낡았으면 200 epoch_stale) → M 번호 기능 →
        `pr_number:` 저장소 지목 → `mnum:` 바인딩 → 조회. 교집합이 빈 사용자는 503 `PERMISSION_UNAVAILABLE`이다
        (원본의 기본 거부, CONTRACT_DIFF D-01). 검색 ES 마감은 3초이며 샤드 실패의 부분 결과만 504 `SEARCH_TIMEOUT`이다.
      parameters:
        - $ref: '#/components/parameters/UpstreamCorrelationId'
        - name: q
          in: query
          required: false
          description: 구조화 질의. 없음·빈 값은 범위 안 전체. 문법·값 오류는 400 `QUERY_SYNTAX_ERROR`, 키 없는 검색어가 2 코드 포인트 미만이면 400 `QUERY_TOO_SHORT`.
          schema:
            type: string
        - name: sort
          in: query
          required: false
          description: SortKey 9개 중 하나(`pr_number`·`merge_seq`·`merged_at`·`created_at`·`updated_at`·`changed_files_count`·`additions`·`lead_time_seconds`·`relevance`). 없음·빈 값은 `merge_seq`. 그 밖은 조회 전에 400 `INVALID_PARAMETER`.
          schema:
            type: string
        - name: order
          in: query
          required: false
          description: 정확히 `asc`만 오름차순이고 그 밖(없음 포함)은 전부 `desc`다. 오류가 없다.
          schema:
            type: string
        - name: size
          in: query
          required: false
          description: 기본 25, 최대 200(초과는 200으로 절삭). 정수가 아니거나 1 미만이면 25(오류 아님).
          schema:
            type: string
        - name: cursor
          in: query
          required: false
          description: 앞 응답의 `next_cursor`. trim 뒤 빈 값은 첫 페이지. 쓸 수 없으면 400 `CURSOR_INVALID`, 조건·범위가 바뀌었으면 400 `CURSOR_QUERY_MISMATCH`.
          schema:
            type: string
        - name: facets
          in: query
          required: false
          description: 정확히 `true`만 참이다. 거짓이면 `facets`·`facets_omitted`·`facets_status` 세 키가 통째로 빠진다.
          schema:
            type: string
        - name: seq_epoch
          in: query
          required: false
          description: q에 `seq:` 범위가 있을 때만 뜻이 있다. 없으면 현재 에폭으로 바인딩한다. 값이 있는데 빈 값·정수 아님·1 미만이면 400. `seq:`가 없는데 오면 400(`sequence_reference_absent`). 현재 에폭과 다르면 조회 없이 200 epoch_stale.
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/SearchOk'
        default:
          $ref: '#/components/responses/ReadSearchError'

  /internal/integrations/pipe/v1/read/resolve:
    get:
      operationId: readResolve
      x-operation-id: read.resolve
      x-api-id: API-INT-007
      x-auth: mtls+grant
      x-original:
        api_id: API-SRCH-001
        method: GET
        path: /api/v1/resolve
      tags: [read]
      summary: 식별자 해석 (원본 API-SRCH-001 실행)
      description: 교집합이 빈 사용자는 503 `PERMISSION_UNAVAILABLE`이다(CONTRACT_DIFF D-01).
      parameters:
        - $ref: '#/components/parameters/UpstreamCorrelationId'
        - name: q
          in: query
          required: false
          description: SHA 접두(7~40 hex)·PR 번호·`owner/repo#N`·GHE URL. 빈 값은 후보 0개(`not_found`). PR 번호로 읽히지 않는 순수 hex가 7자 미만이거나 40자를 넘으면 조회 없이 400 `SHA_PREFIX_TOO_SHORT`.
          schema:
            type: string
        - name: repository
          in: query
          required: false
          description: PR 번호 해석의 저장소 힌트(`owner/name`). 형식이 틀리면 조용히 버린다(오류 없음).
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: 기본 10, 최대 50(초과는 절삭). 정수가 아니거나 1 미만이면 10.
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/ResolveOk'
        default:
          $ref: '#/components/responses/ReadResolveError'

  /internal/integrations/pipe/v1/read/merge-numbers/resolve:
    get:
      operationId: readMergeNumberResolve
      x-operation-id: read.merge_numbers.resolve
      x-api-id: API-INT-008
      x-auth: mtls+grant
      x-original:
        api_id: API-SEQ-007
        method: GET
        path: /api/v1/merge-numbers/resolve
      tags: [read]
      summary: M 번호 ↔ PR 해석 (원본 API-SEQ-007 실행)
      description: |
        검사 순서는 원본과 같다: 접근 범위 → 기능 플래그(꺼져 있으면 404 `NOT_FOUND`, `detail.reason = feature_disabled`)
        → 구조·숫자 → 저장소 접근 범위(범위 밖은 코드를 비교하기 전에 404) → 코드 대조 → 채번 대상 브랜치 → 공간 → 에폭
        → 값. `MNUMBER_ENABLED=true`인 배포에서만 capabilities에 `merge_number:read`가 있다(CONTRACT_DIFF D-07).
      parameters:
        - $ref: '#/components/parameters/UpstreamCorrelationId'
        - name: repository
          in: query
          required: true
          description: '`owner/name`. trim 뒤 두 조각이 아니면 400.'
          schema:
            type: string
        - name: base_branch
          in: query
          required: true
          description: 필수. trim 뒤 비어 있으면 400. 서버가 브랜치를 고르지 않는다.
          schema:
            type: string
        - name: pr_number
          in: query
          required: false
          description: '`merge_number`와 정확히 하나. 1~2147483647, trim하지 않는다. 둘 다 있거나 둘 다 없으면 400.'
          schema:
            type: string
        - name: merge_number
          in: query
          required: false
          description: '`M-<저장소 코드>-<번호>`. `pr_number`와 정확히 하나. 이 방향에서는 `seq_epoch`이 필수다.'
          schema:
            type: string
        - name: seq_epoch
          in: query
          required: false
          description: 없으면 현재 에폭(`pr_number` 방향에서만). 값이 있으면 1 이상 정수. 현재 에폭과 다르면 값을 계산하지 않고 200 epoch_stale.
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/MergeNumberResolveOk'
        default:
          $ref: '#/components/responses/ReadMergeNumberResolveError'

  /internal/integrations/pipe/v1/read/pull-requests/{repository}/{pr_number}:
    get:
      operationId: readPullRequest
      x-operation-id: read.pull_request
      x-api-id: API-INT-009
      x-auth: mtls+grant
      x-original:
        api_id: API-SRCH-003
        method: GET
        path: /api/v1/pull-requests/{repository}/{pr_number}
      tags: [read]
      summary: PR 상세 (원본 API-SRCH-003 실행)
      description: 범위 밖과 없음은 같은 404다. 교집합이 빈 사용자는 503 `PERMISSION_UNAVAILABLE`이다(CONTRACT_DIFF D-01). query key를 받지 않는다.
      parameters:
        - $ref: '#/components/parameters/UpstreamCorrelationId'
        - $ref: '#/components/parameters/Repository'
        - name: pr_number
          in: path
          required: true
          description: 10진 정수 1~2147483647. 아니면 원본처럼 404다.
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/PullRequestOk'
        default:
          $ref: '#/components/responses/ReadEntityDetailError'

  /internal/integrations/pipe/v1/read/commits/{repository}/{commit_sha}:
    get:
      operationId: readCommit
      x-operation-id: read.commit
      x-api-id: API-INT-010
      x-auth: mtls+grant
      x-original:
        api_id: API-SRCH-002
        method: GET
        path: /api/v1/commits/{repository}/{commit_sha}
      tags: [read]
      summary: 커밋 상세 (원본 API-SRCH-002 실행)
      description: 범위 밖과 없음은 같은 404다. 접두 해석은 `/read/resolve`의 몫이다. query key를 받지 않는다.
      parameters:
        - $ref: '#/components/parameters/UpstreamCorrelationId'
        - $ref: '#/components/parameters/Repository'
        - name: commit_sha
          in: path
          required: true
          description: 40자 hex(대소문자 무관). 아니면 원본처럼 404다. 응답의 `commit_sha`는 소문자다.
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/CommitOk'
        default:
          $ref: '#/components/responses/ReadEntityDetailError'

  /internal/integrations/pipe/v1/read/source/{repository}/tree:
    get:
      operationId: readSourceTree
      x-operation-id: read.source.tree
      x-api-id: API-INT-011
      x-auth: mtls+grant
      x-original:
        api_id: API-SRC-001
        method: GET
        path: /api/v1/source/{repository}/tree
      tags: [read]
      summary: source 트리 (원본 API-SRC-001 실행)
      description: 접근 범위를 확인한 뒤에만 GHE를 부른다. 5000 항목 상한이며 넘으면 `truncated`가 참이다. 범위 밖·미등록은 404다.
      parameters:
        - $ref: '#/components/parameters/UpstreamCorrelationId'
        - $ref: '#/components/parameters/Repository'
        - $ref: '#/components/parameters/SourceRef'
        - $ref: '#/components/parameters/SourcePath'
        - $ref: '#/components/parameters/SourceRevision'
        - name: tree_sha
          in: query
          required: false
          description: 하위 트리의 40자 hex. `revision`과 함께 있어야 한다. `path`가 있으면 필수다.
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/SourceTreeOk'
        '429':
          $ref: '#/components/responses/SourceRateLimited'
        default:
          $ref: '#/components/responses/ReadSourceError'

  /internal/integrations/pipe/v1/read/source/{repository}/history:
    get:
