          type: string
        parents:
          type: array
          items:
            type: string
        message:
          type: string
        author:
          type: string
        date:
          type: [string, 'null']
        pull_request_numbers:
          type: [array, 'null']
          uniqueItems: true
          items:
            type: integer

    SourceCommit:
      type: object
      description: >-
        비교 대상 커밋(git commit 객체). author는 git 작성자 이름, date는 committer 날짜(없으면 null).
        (근거: packages/contracts/src/source.ts:4, apps/search-api/src/source/service.ts:17)
