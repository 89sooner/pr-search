    LinkedPullRequest:
      type: object
      description: >-
        커밋 상세에 딸린 PR 요약. 모든 키가 조건부다 — put()이 문서에 값이 있을 때만 넣고, url은 문서에 repository와
        pr_number가 모두 있을 때만 만든다. 코드 주석은 "미머지 PR이면 merge_commit_sha 키가 없다"고 하지만, 투영이 GitHub
        값(문자열 또는 null)을 머지 여부로 거르지 않고 쓰고 put()이 null을 통과시키므로 키가 null로 있거나 미머지 PR에도
        값이 있을 수 있다. author·merged_at도 null일 수 있다.
        (근거: apps/search-api/src/resolve/detail.ts:165-190, apps/pipeline-worker/src/documents.ts:278-286,
        apps/pipeline-worker/src/enriched-payload.ts:81, packages/domain/src/events.ts:114-116)
