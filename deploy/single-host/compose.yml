# PR Search — 단일 호스트 운영 형상 (WP-070 / CR-059 / ADR-021).
#
# **저장소 루트의 `docker-compose.yml`과 다른 파일이다.** 그것은 로컬 개발용이라
# 백킹 서비스만 띄우고 포트를 호스트에 열며 보안을 끈다 — 셋 다 운영에서 반대다.
# 한 파일이 두 뜻을 가지면 읽는 쪽이 어느 것이 사실인지 알 수 없다.
#
# 인프라 3.1장 표의 **Profile A 열이 세우는 단위 전부**를 담는다.
# 역할당 인스턴스는 **하나**이며, 서버가 하나라는 이유로 프로세스 경계를 합치지 않는다.
#
#   docker compose --env-file .env -f compose.yml up -d
#
# 이미지 태그는 `.env`의 `PRS_VERSION`이 정한다. **`latest`를 쓰지 않는다** — 그것은
# 릴리스 신원이 아니다 (DEV-491).

name: pr-search

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgres://${POSTGRES_APP_USER:?}:${POSTGRES_APP_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
  ELASTICSEARCH_NODE: http://elasticsearch:9200
  REDIS_URL: redis://redis:6379
  # 사내 사설 CA. Node 런타임이 직접 읽으므로 코드 변경이 필요 없다 (CR-059).
  # 값이 비어 있으면 Node가 무시한다 — 기본 신뢰 저장소를 그대로 쓴다.
  NODE_EXTRA_CA_CERTS: ${NODE_EXTRA_CA_CERTS:-}
  # **`git` 서브프로세스는 위 변수를 보지 않는다** (DEV-561). 미러 초기화
  # (JOB-MIR-001)와 미러 fetch는 `git`을 직접 부르므로 CA 경로를 따로 받아야
  # 한다. 같은 값을 준다 — 두 변수가 가리키는 파일이 갈리면 같은 호스트에서
  # Node는 붙고 git만 떨어진다. 비어 있으면 git이 무시한다.
  GIT_SSL_CAINFO: ${GIT_SSL_CAINFO:-}

x-ghe-env: &ghe-env
  GHE_BASE_URL: ${GHE_BASE_URL:?}
  GHE_API_URL: ${GHE_API_URL:-}
  GHE_APP_ID: ${GHE_APP_ID:-}
  GHE_APP_PRIVATE_KEY: ${GHE_APP_PRIVATE_KEY:-}
  GHE_INSTALLATIONS: ${GHE_INSTALLATIONS:-}

# **표기 전용 App의 자격이다** (WP-075 / FR-SEQ-009 AC-5, ADR-022 결정 1).
#
# 위 `x-ghe-env`와 **합치지 않는다.** 그 앵커에는 조회용 Data App의 키가 들어
# 있고, 하나로 묶는 순간 조회 자격을 가진 서비스가 쓰기 자격도 함께 받는다 —
# `THR-047`이 막으려는 바로 그 상태다. 공유하는 것은 호스트 주소뿐이며 그것은
# 자격이 아니다.
#
# `MNUMBER_ANNOTATE_ENABLED`의 기본값은 `false`다. 이 정의를 받는 것만으로
# 남의 PR 제목이 바뀌어서는 안 된다.
x-annotate-env: &annotate-env
  GHE_BASE_URL: ${GHE_BASE_URL:?}
  GHE_API_URL: ${GHE_API_URL:-}
  MNUMBER_ANNOTATE_ENABLED: ${MNUMBER_ANNOTATE_ENABLED:-false}
  GHE_ANNOTATE_APP_ID: ${GHE_ANNOTATE_APP_ID:-}
  GHE_ANNOTATE_PRIVATE_KEY: ${GHE_ANNOTATE_PRIVATE_KEY:-}
  GHE_ANNOTATE_INSTALLATIONS: ${GHE_ANNOTATE_INSTALLATIONS:-}

x-worker-base: &worker-base
  image: prs/pipeline-worker:${PRS_VERSION:?}
  restart: unless-stopped
  # **워커는 인바운드 연결을 받지 않는다** (인프라 6장). 하트비트 포트는
  # 컴포즈 네트워크 안에만 있으며 호스트에 발행하지 않는다.
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    elasticsearch: { condition: service_healthy }

services:
  # ---------- backing services ----------
  #
  # **호스트 포트를 발행하지 않는다** (인프라 6장 Profile A 규칙). 오케스트레이터의
  # 네트워크 정책이 없으므로 노출 자체를 줄이는 것이 통제 수단이다.
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_OWNER_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_OWNER_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 30

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.0
    restart: unless-stopped
    environment:
      # **single-node가 파일럿의 결정이다** (CR-059). `OD-006`의 전용 3노드는
      # `production` 환경의 결정이며 그대로 유효하다 — 서버가 하나면 노드를 셋
      # 세워도 장애 도메인이 하나이고 복제본이 아무것도 지켜 주지 못한다.
      discovery.type: single-node
      xpack.security.enabled: 'false'
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms2g -Xmx2g}
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:9200/_cluster/health || exit 1']
      interval: 15s
      timeout: 10s
      retries: 40

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # AOF를 켠다. 큐 내용이 유실되어도 아웃박스가 복구하지만(인프라 11장),
    # 재기동마다 세션이 끊기는 것은 사용자가 겪는 사실이다.
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 20

  # ---------- one-shot 잡 ----------
  #
  # `--profile setup`으로만 뜬다. 항상 켜진 서비스가 아니다.
  migrate:
    image: prs/db:${PRS_VERSION:?}
    profiles: ['setup']
    environment:
      # **스키마 소유자로 접속한다.** 애플리케이션 롤(`prs_app`)에는 DDL 권한이
      # 없으며, 그것이 감사 기록 불변성의 방어선이다 (마이그레이션 005).
      DATABASE_URL: postgres://${POSTGRES_OWNER_USER:?}:${POSTGRES_OWNER_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
    depends_on:
      postgres: { condition: service_healthy }

  es-bootstrap:
    image: prs/es:${PRS_VERSION:?}
    profiles: ['setup']
    environment:
      ELASTICSEARCH_NODE: http://elasticsearch:9200
    depends_on:
      elasticsearch: { condition: service_healthy }

  # 전량 재색인 **예약**용 일회성 실행 (JOB-ING-006 / DEV-511).
  #
  # 실행 자체는 `batch` 역할이 큐에서 집어 한다 — 여기서 인라인으로 돌리면
  # 동시 실행 상한(1)을 우회하고 진행 상태가 운영 콘솔에 나타나지 않는다.
  reindex:
    image: prs/pipeline-worker:${PRS_VERSION:?}
    profiles: ['setup']
    environment:
      <<: *app-env
    depends_on:
      postgres: { condition: service_healthy }
      elasticsearch: { condition: service_healthy }

  # ---------- 사용자 접점 ----------
  #
  # **호스트에 발행하는 포트는 이 둘뿐이다.** `search-api`는 발행하지 않는다 —
  # 조회는 전부 `web`을 거치므로(ADR-011) 외부에서 직접 닿을 이유가 없다.
  # **healthcheck는 `127.0.0.1`이지 `localhost`가 아니다.** alpine에서 `localhost`는
  # `::1`로 먼저 해석되는데 Fastify 기본 바인딩은 IPv4라 곧바로 거부된다 —
  # 서비스는 멀쩡한데 컨테이너가 unhealthy로 보이고, `depends_on`이 그것을 기다린다.
  web:
    image: prs/web:${PRS_VERSION:?}
    restart: unless-stopped
    ports:
      - '${WEB_BIND:-0.0.0.0}:${WEB_PORT:-3000}:3000'
    environment:
      <<: *app-env
      WEB_PORT: '3000'
      SEARCH_API_URL: http://search-api:3002
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      # 평문 HTTP 파일럿 전용 (CR-091). `SESSION_COOKIE_SECURE=false`와 **함께** 적어야 인증을 켠 채 선다.
      # 쿠키를 발급하는 것은 `web`뿐이므로 **`web`에만 준다** — search-api는 SESSION_COOKIE_SECURE도 받지 않는다.
      ALLOW_INSECURE_COOKIES: ${ALLOW_INSECURE_COOKIES:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      # 브라우저가 IdP에서 돌아올 주소. **`web`만 쓴다** — `search-api`는 OIDC
      # 왕복을 하지 않는다. `AUTH_ENABLED=true`인데 이 값이 비면 로그인이 500이다
      # (`DEV-579`). 값은 `<서비스 주소>/auth/callback`이다.
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      OIDC_AUTHORIZATION_ENDPOINT: ${OIDC_AUTHORIZATION_ENDPOINT:-}
      OIDC_TOKEN_ENDPOINT: ${OIDC_TOKEN_ENDPOINT:-}
      OIDC_JWKS_URI: ${OIDC_JWKS_URI:-}
      OIDC_SCOPES: ${OIDC_SCOPES:-}
      OIDC_GROUPS_CLAIM: ${OIDC_GROUPS_CLAIM:-}
      OIDC_GROUP_ROLE_MAP: ${OIDC_GROUP_ROLE_MAP:-}
      # ── 사내 GHE 직접 로그인 (CR-083) ──────────────────────────
      # `oidc`(기본) | `github`. **`github`를 고르면 위 OIDC 값은 쓰이지 않고
      # 아래 넷이 필수가 된다.** 별도 IdP 없이 사내 GHE 계정으로 로그인한다.
      AUTH_PROVIDER: ${AUTH_PROVIDER:-}
      # 수집 경로와 **같은 서버**를 가리킨다. `x-ghe-env`는 `web`에 오지 않으므로
      # 여기 따로 준다 — `web`은 수집 자격(`GHE_APP_ID`)을 받지 않는다.
      GHE_BASE_URL: ${GHE_BASE_URL:-}
      GHE_API_URL: ${GHE_API_URL:-}
      # **수집용 GitHub App과 다른 자격이다.** 로그인용 OAuth App을 따로 등록한다
      # — 자격을 나눠 쓰면 유출 시 피해 범위가 달라진다 (`ADR-022`의 근거).
      GHE_OAUTH_CLIENT_ID: ${GHE_OAUTH_CLIENT_ID:-}
      GHE_OAUTH_CLIENT_SECRET: ${GHE_OAUTH_CLIENT_SECRET:-}
      # `<서비스 주소>/auth/callback`. GHE OAuth App에 등록한 값과 문자 그대로
      # 같아야 한다. `OIDC_REDIRECT_URI`와 같은 자리이고 같은 함정이다.
      GHE_OAUTH_REDIRECT_URI: ${GHE_OAUTH_REDIRECT_URI:-}
      GHE_OAUTH_SCOPES: ${GHE_OAUTH_SCOPES:-}
      # `<org>/<team>:<역할>` 쌍을 쉼표로 잇는다. 부여할 수 있는 역할은
      # `manager`와 `qa`뿐이다 (CR-015, DEV-049) — GHE 팀을 만들 수 있는 사람이
      # 운영 권한을 발급하게 두지 않는다. 비워 두면 모두 `developer`다.
      GHE_TEAM_ROLE_MAP: ${GHE_TEAM_ROLE_MAP:-}
      # M 번호 (WP-074)는 여기에 없다 — **web은 이 값을 읽지 않는다** (DEV-589).
      # 화면은 응답에 M 키가 있는지로만 판단하고, 켜고 끄는 것은 search-api와
      # worker-sequence의 같은 값이다. 여기 두면 한쪽만 바꿔 놓고 켰다고 믿게 된다.
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/healthz >/dev/null || exit 1']
      interval: 20s
      timeout: 10s
      retries: 15
    depends_on:
      search-api: { condition: service_started }

  search-api:
    image: prs/search-api:${PRS_VERSION:?}
    restart: unless-stopped
    environment:
      <<: [*app-env, *ghe-env]
      SEARCH_API_PORT: '3002'
      SEARCH_CURSOR_HMAC_KEY: ${SEARCH_CURSOR_HMAC_KEY:?}
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      METRICS_QUERY_URL: ${METRICS_QUERY_URL:-}
      # OIDC 세션과 함께 구성하면 **기동을 거부한다** (DEV-048). 둘 중 하나다.
      ADMIN_API_TOKENS: ${ADMIN_API_TOKENS:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_AUTHORIZATION_ENDPOINT: ${OIDC_AUTHORIZATION_ENDPOINT:-}
      OIDC_TOKEN_ENDPOINT: ${OIDC_TOKEN_ENDPOINT:-}
      OIDC_JWKS_URI: ${OIDC_JWKS_URI:-}
      OIDC_SCOPES: ${OIDC_SCOPES:-}
      OIDC_GROUPS_CLAIM: ${OIDC_GROUPS_CLAIM:-}
      OIDC_GROUP_ROLE_MAP: ${OIDC_GROUP_ROLE_MAP:-}
      # M 번호 (WP-074). 꺼져 있으면 API-SEQ-007이 404이고 목록·상세·범위에서 M 키가 생략된다.
      MNUMBER_ENABLED: ${MNUMBER_ENABLED:-false}
      # ── GitHub Operations Plane (REL-007 R0 / WP-077, CR-086) ──────────
      # 기본 꺼짐. 켜면 `/api/v1/gh/*`가 서고 **Operations App** 자격이 필수다 — 수집용
      # Data App(`GHE_APP_ID`)·로그인용 OAuth App·표기 App과 자격을 공유하지 않는다
      # (FR-GH-008 AC-1). 켜 놓고 비어 있으면 기동을 거부한다. `gh-executor`와 같은
      # `GH_OPERATIONS_ENABLED`·`GH_IDENTITY_VAULT_KEY`여야 한다.
      GH_OPERATIONS_ENABLED: ${GH_OPERATIONS_ENABLED:-false}
      GHE_OPS_CLIENT_ID: ${GHE_OPS_CLIENT_ID:-}
      GHE_OPS_CLIENT_SECRET: ${GHE_OPS_CLIENT_SECRET:-}
      GHE_OPS_REDIRECT_URI: ${GHE_OPS_REDIRECT_URI:-}
      GH_IDENTITY_VAULT_KEY: ${GH_IDENTITY_VAULT_KEY:-}
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3002/healthz >/dev/null || exit 1']
      interval: 20s
      timeout: 10s
      retries: 15
    depends_on:
      postgres: { condition: service_healthy }
      elasticsearch: { condition: service_healthy }
      redis: { condition: service_healthy }

  ingest-gateway:
    image: prs/ingest-gateway:${PRS_VERSION:?}
    restart: unless-stopped
    ports:
      - '${INGEST_BIND:-0.0.0.0}:${INGEST_GATEWAY_PORT:-3001}:3001'
    environment:
      <<: *app-env
      INGEST_GATEWAY_PORT: '3001'
      GHE_WEBHOOK_SECRET: ${GHE_WEBHOOK_SECRET:?}
      GHE_WEBHOOK_SECRET_PREVIOUS: ${GHE_WEBHOOK_SECRET_PREVIOUS:-}
      INGEST_SHUTDOWN_GRACE_MS: ${INGEST_SHUTDOWN_GRACE_MS:-30000}
      INGEST_ENQUEUE_TIMEOUT_MS: ${INGEST_ENQUEUE_TIMEOUT_MS:-150}
      INGEST_ARCHIVE_PATH: /var/lib/prs/archive/raw-events.ndjson
      INGEST_ARCHIVE_MAX_BYTES: ${INGEST_ARCHIVE_MAX_BYTES:-67108864}
      INGEST_ARCHIVE_KEEP: ${INGEST_ARCHIVE_KEEP:-5}
    volumes:
      - archive-data:/var/lib/prs/archive
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3001/healthz >/dev/null || exit 1']
      interval: 20s
      timeout: 10s
      retries: 15
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  # **`filebeat`는 게이트웨이의 사이드카다** (CR-052). Profile A는 게이트웨이가
  # 하나뿐이라 `DEV-369`의 `PIPE_BUF` 경합이 아예 성립하지 않는다 — 이 형상에서는
  # Kubernetes보다 배선이 단순하다.
  filebeat:
    image: docker.elastic.co/beats/filebeat:8.13.4
    restart: unless-stopped
    user: root
    command: ['filebeat', '-e', '--strict.perms=false']
    volumes:
      - archive-data:/var/lib/prs/archive:ro
      - filebeat-data:/usr/share/filebeat/data
      - ./filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
    depends_on:
      elasticsearch: { condition: service_healthy }

  # ---------- pipeline-worker 역할 ----------
  #
  # 역할마다 컨테이너 하나다. **합치지 않는 이유**는 워커 풀을 나눌 수 있어야
  # 한다는 요구(FR-ING-006 AC-3)에서 나왔고, 합치면 Profile B로 돌아갈 수 없다.
  worker-enrich:
    <<: *worker-base
    environment:
      <<: [*app-env, *ghe-env]
      # **`backfill`을 함께 켠다** (DEV-304). 코드가 이 갈래를 `enrich` 안에서
      # 세우고 모든 백필 호출이 `priority: 'backfill'`이라 실시간이 먼저 비워진다.
      # 서버가 하나라 워커 풀을 나눌 이유가 없으며, **첫 반입 후 기존 PR 히스토리를
      # 채우지 못하면 시스템이 사실상 비어 있다.**
      PIPELINE_WORKER_ROLES: enrich,backfill
      PIPELINE_WORKER_PORT: '3003'
      BACKFILL_MAX_CONCURRENCY: ${BACKFILL_MAX_CONCURRENCY:-2}

  worker-project:
    <<: *worker-base
    environment:
      <<: *app-env
      PIPELINE_WORKER_ROLES: project
      PIPELINE_WORKER_PORT: '3003'

  worker-sequence:
    <<: *worker-base
    environment:
      <<: [*app-env, *ghe-env]
      PIPELINE_WORKER_ROLES: sequence
      PIPELINE_WORKER_PORT: '3003'
      MIRROR_ROOT: /var/lib/prs/mirrors
      MIRROR_ALLOW_BLOB_FETCH: ${MIRROR_ALLOW_BLOB_FETCH:-false}
      # 채번 전 미러 fetch (WP-074 / DEV-576). Profile A는 `mirror`가 기본이며
      # 아래 볼륨이 그 전제다. 볼륨이 없으면 **기동을 거부한다** — 조용히 API로
      # 바꾸면 "설정은 mirror인데 왜 API로 도나"를 아무도 답할 수 없다.
      SEQUENCE_GRAPH_MODE: ${SEQUENCE_GRAPH_MODE:-mirror}
      # M 번호 (WP-074). 꺼져 있어도 위 freshness는 그대로 돈다 — DEV-576의 수정은
      # 이 플래그와 무관하다.
      MNUMBER_ENABLED: ${MNUMBER_ENABLED:-false}
      MNUMBER_BATCH_SIZE: ${MNUMBER_BATCH_SIZE:-100}
      MNUMBER_POLL_MS: ${MNUMBER_POLL_MS:-1000}
    volumes:
      - mirror-data:/var/lib/prs/mirrors

  worker-mirror:
    <<: *worker-base
    environment:
      <<: [*app-env, *ghe-env]
      PIPELINE_WORKER_ROLES: mirror
      PIPELINE_WORKER_PORT: '3003'
      MIRROR_ROOT: /var/lib/prs/mirrors
      MIRROR_ALLOW_BLOB_FETCH: ${MIRROR_ALLOW_BLOB_FETCH:-false}
    volumes:
      - mirror-data:/var/lib/prs/mirrors

  # **`release`를 세운다** (DEV-305). 태그의 정본이 미러이므로(DEV-143) 이 역할은
  # 미러 볼륨을 요구한다 — 그것이 Profile B에서 manifest를 만들지 못한 이유였고,
  # 단일 호스트에서는 같은 명명 볼륨을 함께 마운트하면 성립한다.
  worker-release:
    <<: *worker-base
    environment:
      <<: [*app-env, *ghe-env]
      PIPELINE_WORKER_ROLES: release
      PIPELINE_WORKER_PORT: '3003'
      MIRROR_ROOT: /var/lib/prs/mirrors
      MIRROR_ALLOW_BLOB_FETCH: ${MIRROR_ALLOW_BLOB_FETCH:-false}
    volumes:
      - mirror-data:/var/lib/prs/mirrors

  worker-link:
    <<: *worker-base
    environment:
      <<: *app-env
      PIPELINE_WORKER_ROLES: link
      PIPELINE_WORKER_PORT: '3003'

  worker-reconcile:
    <<: *worker-base
    environment:
      <<: [*app-env, *ghe-env]
      PIPELINE_WORKER_ROLES: reconcile
      PIPELINE_WORKER_PORT: '3003'

  # **`batch`와 `reconcile`은 인스턴스가 하나여야 한다.** 리더 선출이 없는 주기
  # 스윕을 갖기 때문이며, Profile B의 replica 1과 같은 이유다 (CR-046, DEV-311).
  worker-batch:
    <<: *worker-base
    environment:
      <<: *app-env
      PIPELINE_WORKER_ROLES: batch
      PIPELINE_WORKER_PORT: '3003'
      # 없으면 `JOB-AUD-001`만 서지 않는다. 나머지 배치 역할은 정상 동작한다.
      ADMIN_DATABASE_URL: ${ADMIN_DATABASE_URL:-}
      # M 번호 (WP-074 / DEV-606). **재색인이 이 역할에서 돈다** — 값이 없으면
      # 재색인 뒤 M 복구 의도를 만들지 않아 새 색인의 M이 영영 비고, 그것이
      # 오류도 로그도 없이 조용히 일어난다. search-api·worker-sequence와 같은 값이다.
      MNUMBER_ENABLED: ${MNUMBER_ENABLED:-false}

  worker-authz:
    <<: *worker-base
    environment:
      <<: [*app-env, *ghe-env]
      PIPELINE_WORKER_ROLES: authz
      PIPELINE_WORKER_PORT: '3003'

  # **GHE에 쓰는 유일한 서비스다** (JOB-SEQ-005 / WP-075, ADR-022).
  #
  # 조회용 `*ghe-env`를 merge하지 **않는다** — 그 앵커에 Data App의 개인 키가 있고,
  # 여기서 받으면 "조회 자격과 쓰기 자격을 공유하지 않는다"(FR-SEQ-009 AC-5)가
  # 배포에서 거짓이 된다. 반대로 다른 워커에는 `*annotate-env`를 주지 않는다.
  #
  # **인스턴스 하나는 성능 조정이 아니라 정확성 조건이다** (DEV-629). 회차가
  # 겹치지 않게 막는 장치가 프로세스 안에만 있어, 여러 벌이 뜨면 한쪽이 붙들고
  # 있는 이벤트를 30초 뒤 다른 쪽이 가져가 같은 행을 동시에 처리한다. 늘리려면
  # 먼저 분산 claim이 필요하며 이 값을 올리는 것만으로는 안 된다.
  worker-annotate:
    <<: *worker-base
    environment:
      <<: [*app-env, *annotate-env]
      PIPELINE_WORKER_ROLES: annotate
      PIPELINE_WORKER_PORT: '3003'

  # ---------- GitHub Operations Plane ----------
  #
  # **`gh`를 띄우는 유일한 서비스다** (ADR-013·ADR-016, REL-007 R0 / WP-077, CR-086).
  # `search-api`·`web`·워커는 `gh` 프로세스를 만들지 않는다.
  #
  # 자격 배선: 조회용 `*ghe-env`(Data App 키)도 `*annotate-env`(표기 App 키)도 받지
  # **않는다.** 실행에 쓰는 것은 사용자가 위임한 토큰이며, 그것은 DB의 봉인을
  # `GH_IDENTITY_VAULT_KEY`로 풀어 실행 순간에만 프로세스 환경으로 넘긴다 (FR-GH-008 AC-6).
  # Operations App의 client secret은 이 서비스에 없다 — 인가·갱신은 `search-api`가 한다.
  #
  # 격리 (NFR-010): 비루트, 읽기 전용 루트 파일시스템, 쓰기는 실행별 workspace가 있는
  # tmpfs 한 곳. Elasticsearch에 붙지 않는다 (인프라 6장).
  #
  # **선택 프로파일이다** (`github-operations`). 파일럿 기본 형상은 이 서비스를 세우지
  # 않는다는 `CR-059`의 결정을 지키되, 이미지는 번들에 담아 `.env` 한 줄로 켤 수 있게 한다.
  # `prsctl`이 `.env`의 `GH_OPERATIONS_ENABLED=true`를 읽어 `--profile github-operations`를
  # 붙이므로, **search-api만 켜지고 실행기가 없는 형상**(요청이 영원히 `queued`)은 `prsctl`로는
  # 만들어지지 않는다 — 켜고 끄는 자리는 `.env` 하나뿐이다.
  #
  # `GH_OPERATIONS_ENABLED=false`(기본)면 헬스체크만 서고 아무것도 구독하지 않는다.
  gh-executor:
    image: prs/gh-executor:${PRS_VERSION:?}
    profiles: ['github-operations']
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/lib/prs/gh-workspaces:size=256m,mode=0700,uid=1000,gid=1000
      - /tmp:size=64m
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_APP_USER:?}:${POSTGRES_APP_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
      REDIS_URL: redis://redis:6379
      # **Node용 CA 변수를 받지 않는다.** 이 프로세스의 Node 런타임은 GHE에 접속하지 않는다 —
      # GHE 통신은 gh(Go)가, 토큰 갱신은 search-api가 한다. gh는 Node의 CA 변수를 읽지
      # 않으므로 같은 파일(사설 CA)을 실행 환경의 `SSL_CERT_FILE`로 넘길 경로만 받는다.
      # 다른 서비스와 같은 컨테이너 안 경로다 (런북 6장 「사설 CA」).
      GH_EXECUTOR_CA_FILE: ${NODE_EXTRA_CA_CERTS:-}
      GHE_BASE_URL: ${GHE_BASE_URL:?}
      GH_OPERATIONS_ENABLED: ${GH_OPERATIONS_ENABLED:-false}
      GH_IDENTITY_VAULT_KEY: ${GH_IDENTITY_VAULT_KEY:-}
      GH_EXECUTOR_PORT: '3004'
      # 레지스트리 검사(JOB-GH-003, CR-088) 주기. 기동 시에는 주기와 무관하게 한 번 돈다.
      GH_EXECUTOR_REGISTRY_CHECK_MS: ${GH_EXECUTOR_REGISTRY_CHECK_MS:-86400000}
      GH_EXECUTOR_MAX_CONCURRENT: ${GH_EXECUTOR_MAX_CONCURRENT:-2}
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3004/healthz >/dev/null || exit 1']
      interval: 20s
      timeout: 10s
      retries: 15
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

volumes:
  # **정본과 재구성 가능한 캐시를 나눈다** (인프라 9.4장). 백업 전략이 볼륨마다
  # 다르므로 하나로 묶지 않는다.
  postgres-data:      # 정본 — 백업 대상
  elasticsearch-data: # 파생 — PostgreSQL에서 재색인 가능
  redis-data:         # 큐·세션 — 아웃박스가 복구한다
  mirror-data:        # 캐시 — 재클론 가능
  archive-data:       # 원본 아카이브 — `raw_event`가 보존 보증을 진다
  filebeat-data:      # 적재 오프셋
