# M 번호 lightweight 태그 전용 App의 자격 (WP-100 / FR-SEQ-012 AC-6, ADR-026 결정 3, CR-115).
#
# **조회용 시크릿·표기용 시크릿과 나눈 세 번째 시크릿이다.** 태그 생성은
# `Contents: write`(공식 문서가 `POST /repos/{o}/{r}/git/refs`에 요구하는 권한)라
# 표기 App의 `Pull requests: write`보다 넓다 — 한 시크릿에 담으면 한 키의 유출이
# 두 반경을 함께 연다. 나눠 두면 한 App의 회전이나 유출 사건이 다른 App까지 함께
# 무효화하지 않는다 (보안 문서 6장·13.5절).
#
# **자리표시자만 있다.** 실제 값은 사내 시크릿 관리에서 주입한다.
#
# 이 App은 GHE에 **따로 등록한다.** 권한 반경은 `Contents: write` 하나이며,
# 태그를 만들 저장소에만 설치한다. 같은 App을 표기 시크릿에도 넣는 것은 운영자의
# 선택이지 이 정의의 전제가 아니다. 이 시크릿을 받는 파드는 `pipeline-worker-annotate`
# (`PIPELINE_WORKER_ROLES=annotate,tag`) 하나뿐이다.
#
# **`MNUMBER_TAG_ENABLED`의 기본값은 꺼짐이다.** 이 시크릿을 만드는 것만으로는
# 원격 저장소에 태그가 생기지 않는다. 켜기 전에 저장소 ruleset으로 `M-*` 태그의
# 갱신·삭제를 막아 둔다 (RUNBOOK 7.F).
apiVersion: v1
kind: Secret
metadata:
  name: prs-tag-secrets
  namespace: pr-search
  labels:
    app.kubernetes.io/part-of: pr-search
    app.kubernetes.io/component: pipeline-worker-annotate
type: Opaque
stringData:
  GHE_TAG_APP_ID: REPLACE_ME
  # 개행은 `\n`으로 이스케이프해 한 줄로 넣는다 (@prs/github-tag가 되돌린다)
  GHE_TAG_PRIVATE_KEY: REPLACE_ME
  # org:installationId 쉼표 구분. 조회용 `GHE_INSTALLATIONS`·표기용
  # `GHE_ANNOTATE_INSTALLATIONS`와 **다른 값이다** — 설치가 다르면 설치 ID도 다르다.
  GHE_TAG_INSTALLATIONS: acme:REPLACE_ME
