# 역할별로 따로 띄운다. 적체 축이 달라 스케일 기준이 다르기 때문이다
# (인프라 3장: enrich는 prs:ingest 적체, project는 prs:enriched 적체).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pipeline-worker-enrich
  namespace: pr-search
  labels: { app.kubernetes.io/part-of: pr-search, app.kubernetes.io/component: pipeline-worker-enrich }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/component: pipeline-worker-enrich }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app.kubernetes.io/component: pipeline-worker-enrich }
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/path: /metrics
        prometheus.io/port: '3003'
    spec:
      # 처리 중 이벤트를 끝내고 나간다. ack하지 못한 것은 다른 소비자가
      # claimIdleMs 뒤에 이어받으므로 유실은 아니다.
      terminationGracePeriodSeconds: 60
      containers:
        - name: pipeline-worker
          image: prs/pipeline-worker:latest
          env:
            - name: PIPELINE_WORKER_ROLES
              value: enrich
          ports:
            - name: http
              containerPort: 3003
          envFrom:
            - configMapRef: { name: prs-config }
            - secretRef: { name: prs-secrets }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests: { cpu: 300m, memory: 384Mi }
            limits: { memory: 768Mi }
