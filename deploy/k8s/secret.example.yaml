# **자리표시자만 있다.** 실제 값은 사내 시크릿 관리에서 주입한다.
# 이 파일을 그대로 apply하면 인증이 전부 실패한다 — 그것이 의도다.
apiVersion: v1
kind: Secret
metadata:
  name: prs-secrets
  namespace: pr-search
  labels:
    app.kubernetes.io/part-of: pr-search
type: Opaque
stringData:
  DATABASE_URL: postgres://REPLACE_ME@postgres.pr-search.svc.cluster.local:5432/prs

  # 회전 기간에는 구·신 두 값을 모두 둔다 (보안 문서 6장)
  GHE_WEBHOOK_SECRET: REPLACE_ME
  GHE_WEBHOOK_SECRET_PREVIOUS: ''

  GHE_APP_ID: REPLACE_ME
  # 개행은 `\n`으로 이스케이프해 한 줄로 넣는다 (@prs/github이 되돌린다)
  GHE_APP_PRIVATE_KEY: REPLACE_ME
  # org:installationId 쉼표 구분 (CR-010, DEV-015)
  GHE_INSTALLATIONS: acme:12345

  # 이름:토큰 쌍. 이름이 감사 기록의 주체가 된다 (CR-013, DEV-030).
  # 사람마다 다른 값을 준다 — 하나를 공유하면 "누가 했는가"에 답할 수 없다.
  ADMIN_API_TOKENS: alice:REPLACE_ME,bob:REPLACE_ME

  # 검색 커서 서명 키 (WP-032 / ADR-010 Amendment).
  #
  # **없으면 운영에서 기동하지 않는다** — 서명 없는 커서를 발급하는 대신
  # 배포가 잘못됐음을 말한다. 커서가 조용히 사라지면 사용자는 5만 건 구간을
  # 끝까지 훑을 방법이 없어지는데, 그 실패는 오류가 아니라 "결과가 이게
  # 전부"로 보인다.
  #
  # 최소 32자. 복제본 전부가 **같은 값**을 써야 한다 — 다르면 한 복제본이
  # 발급한 커서를 다른 복제본이 CURSOR_INVALID로 거절한다.
  #
  # 회전하면 진행 중이던 페이징이 전부 끊긴다(첫 페이지로 복귀). 그것이 옳다 —
  # 세션 쿠키와 달리 커서는 5분짜리 위치 표식이라 유예 기간이 필요 없다.
  SEARCH_CURSOR_HMAC_KEY: REPLACE_ME_WITH_32_OR_MORE_CHARS
