# PR 제목 M 넘버 표기 역할 (JOB-SEQ-005 / WP-075, FR-SEQ-009, ADR-022).
#
# **이 제품이 사람의 지시 없이 GHE에 쓰는 유일한 파드다.** 그래서 자격 배선이
# 다른 워커와 다르다.
#
#   - `prs-secrets`를 `envFrom`으로 통째로 받지 **않는다.** 그 시크릿에는 조회용
#     Data App의 개인 키(`GHE_APP_PRIVATE_KEY`)가 들어 있고, 통째로 받으면 이
#     파드가 조회 자격과 쓰기 자격을 동시에 쥔다 — `FR-SEQ-009` AC-5가 막으려는
#     상태이며 `THR-047`의 완화 근거가 사라진다.
#   - 대신 표기 전용 시크릿(`prs-annotate-secrets`)을 받고, 공용 값인
#     `DATABASE_URL` **하나만** 골라 받는다.
#   - 반대 방향도 지킨다: 다른 워커 manifest는 `prs-annotate-secrets`를 참조하지
#     않는다. 두 App의 키가 서로 다른 시크릿에 있어야 한 App의 회전·유출이 다른
#     App까지 함께 무효화하지 않는다 (보안 문서 6장).
#
# **replicas: 1은 성능 조정이 아니라 정확성 조건이다** (`DEV-629`).
#
# 회차가 겹치지 않게 막는 장치(`passChain`)가 **프로세스 안에만** 있다. 파드가
# 둘이면 한쪽이 붙들고 있는 이벤트를 30초 뒤 다른 쪽이 `XCLAIM`으로 가져가
# 같은 행을 동시에 처리한다 — 제목은 멱등이라 망가지지 않지만 요청과 감사가
# 두 벌이 되고, `DEV-620`이 닫은 이중 쓰기가 그 자리에서 다시 열린다.
# 잔여 스윕도 리더 선출이 없어 같은 문제를 갖는다.
#
# **늘리려면 먼저 분산 claim이 필요하다.** 이 값을 올리는 것만으로는 안 된다.
#
# **`MNUMBER_ANNOTATE_ENABLED`의 기본값은 꺼짐이다.** 이 manifest를 적용하는 것
# 만으로는 아무 PR 제목도 바뀌지 않는다. 운영자가 값을 켜고 전용 App 자격을 채운
# 뒤에야 쓰기가 시작되며, 켜 놓고 자격이 없으면 파드가 기동을 거부한다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pipeline-worker-annotate
  namespace: pr-search
  labels: { app.kubernetes.io/part-of: pr-search, app.kubernetes.io/component: pipeline-worker-annotate }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/component: pipeline-worker-annotate }
  # 표기 회차가 진행 중인 파드를 새 파드와 겹쳐 띄우지 않는다. 겹치면 두 파드가
  # 같은 행을 집어 같은 PR에 요청이 두 번 나간다(결과는 멱등이나 한도를 두 배 쓴다).
  strategy:
    type: Recreate
  template:
    metadata:
      labels: { app.kubernetes.io/component: pipeline-worker-annotate }
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/path: /metrics
        prometheus.io/port: '3003'
    spec:
      # 진행 중인 회차를 마치고 나간다. PATCH 뒤 정본 갱신 전에 끊겨도 다음 회차가
      # 제목을 다시 읽어 호출 없이 복구하지만, 그 복구도 요청 한 번을 쓴다.
      terminationGracePeriodSeconds: 60
      containers:
        - name: pipeline-worker
          image: prs/pipeline-worker:latest
          env:
            - name: PIPELINE_WORKER_ROLES
              value: annotate
            # **공용 값 하나만 골라 받는다.** `envFrom`으로 `prs-secrets`를 받으면
            # 같은 시크릿의 `GHE_APP_PRIVATE_KEY`가 함께 온다.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: prs-secrets, key: DATABASE_URL }
            - name: MNUMBER_ANNOTATE_ENABLED
              valueFrom:
                configMapKeyRef: { name: prs-config, key: MNUMBER_ANNOTATE_ENABLED, optional: true }
          ports:
            - name: http
              containerPort: 3003
          envFrom:
            - configMapRef: { name: prs-config }
            # 표기 전용 자격만 있는 시크릿이다. 조회 App의 키는 여기 없다.
            - secretRef: { name: prs-annotate-secrets }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 3
            periodSeconds: 5
          # HTTP 요청 몇 건과 작은 질의가 전부다. 다른 워커보다 적게 준다.
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { memory: 512Mi }
