# 시크릿이 아닌 설정만 둔다. 토큰·키·비밀번호는 Secret으로 간다 (보안 문서 6장).
apiVersion: v1
kind: ConfigMap
metadata:
  name: prs-config
  namespace: pr-search
  labels:
    app.kubernetes.io/part-of: pr-search
data:
  # 백킹 서비스. 호스트 이름은 환경마다 다르므로 kustomize 오버레이가 덮는다.
  REDIS_URL: redis://redis.pr-search.svc.cluster.local:6379
  ELASTICSEARCH_NODE: http://elasticsearch.pr-search.svc.cluster.local:9200
  GHE_BASE_URL: https://ghe.example.com

  # PR 제목 M 넘버 표기 (WP-075 / JOB-SEQ-005). **기본은 꺼짐이다** — 이 제품이
  # 사람의 지시 없이 GHE를 고치는 경로(CR-115 이전에는 유일했다)이므로, 값을 켜고 표기 전용 App
  # 자격을 채운 배포에서만 쓰기가 시작된다. 켜 놓고 자격이 없으면 그 파드는
  # 기동을 거부한다. `MNUMBER_ENABLED`(채번)와 **다른 값이다**: 번호는 보되
  # 제목은 아직 건드리지 않는 형상이 정상이며 사내 반입의 첫 단계가 그것이다.
  MNUMBER_ANNOTATE_ENABLED: 'false'

  # M 번호 lightweight 태그 (WP-100 / JOB-SEQ-007, CR-115). **기본은 꺼짐이다** — 두 번째
  # 자동 GHE 쓰기이며 표기와 **다른 값이다**: 제목은 표기하되 태그는 아직 만들지 않는 형상이
  # 정상이다. 켜기 전에 태그 전용 App의 시크릿(`tag-secret.example.yaml`)과 `M-*` ruleset을 준비한다
  # (RUNBOOK 7.F). 켜 놓고 자격이 없으면 `pipeline-worker-annotate` 파드가 기동을 거부한다.
  MNUMBER_TAG_ENABLED: 'false'

  # 게이트웨이 (인프라 3장: graceful shutdown 30초)
  INGEST_GATEWAY_PORT: '3001'
  INGEST_SHUTDOWN_GRACE_MS: '30000'
  # 아웃박스가 받으므로 발행 마감을 짧게 둔다 (NFR-002의 300ms 예산 안)
  INGEST_ENQUEUE_TIMEOUT_MS: '150'
  INGEST_ARCHIVE_PATH: /var/lib/prs/archive/raw-events.ndjson
  # 아카이브 조각 경계와 보관 개수 (FR-ING-010 AC-7, CR-052).
  #
  # 곱한 값이 `ingest-gateway.yaml`의 `emptyDir.sizeLimit`보다 작아야 한다.
  # 한쪽만 올리면 파일이 볼륨을 채우고, 그때 레인 B의 정체가 레인 A를 멈춘다.
  INGEST_ARCHIVE_MAX_BYTES: '67108864'
  INGEST_ARCHIVE_KEEP: '5' 

  SEARCH_API_PORT: '3002'
  PIPELINE_WORKER_PORT: '3003'
