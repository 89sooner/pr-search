# PR 제목 표기 전용 App의 자격 (WP-075 / FR-SEQ-009 AC-5, ADR-022 결정 1).
#
# **`prs-secrets`와 나눈 별개의 시크릿이다.** 한 시크릿에 담으면 `envFrom`으로
# 그것을 받는 모든 파드가 쓰기 자격을 함께 쥐게 되고, 그러면 "조회용 Data App과
# 자격 증명을 공유하지 않는다"가 배포에서 거짓이 된다. 나눠 두면 한 App의
# 회전이나 유출 사건이 다른 App까지 함께 무효화하지 않는다 (보안 문서 6장).
#
# **자리표시자만 있다.** 실제 값은 사내 시크릿 관리에서 주입한다.
#
# 이 App은 GHE에 **따로 등록한다.** 권한 반경은 `Pull requests: write` 하나이며
# (공식 문서가 이 엔드포인트에 요구하는 권한이 그것뿐이다), 수집용 App과
# 자격을 공유하지 않는다. 표기 대상 저장소에만 설치한다.
apiVersion: v1
kind: Secret
metadata:
  name: prs-annotate-secrets
  namespace: pr-search
  labels:
    app.kubernetes.io/part-of: pr-search
    app.kubernetes.io/component: pipeline-worker-annotate
type: Opaque
stringData:
  GHE_ANNOTATE_APP_ID: REPLACE_ME
  # 개행은 `\n`으로 이스케이프해 한 줄로 넣는다 (@prs/github-annotate가 되돌린다)
  GHE_ANNOTATE_PRIVATE_KEY: REPLACE_ME
  # org:installationId 쉼표 구분. 조회용 `GHE_INSTALLATIONS`와 **다른 값이다** —
  # 설치가 다르면 설치 ID도 다르다.
  GHE_ANNOTATE_INSTALLATIONS: acme:REPLACE_ME
