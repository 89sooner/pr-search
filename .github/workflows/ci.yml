name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 버전은 package.json의 packageManager가 단일 출처다.
      # 여기에 version을 함께 적으면 action-setup이 중복 지정으로 실패한다.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: typecheck
        run: pnpm typecheck

      - name: lint
        run: pnpm lint

      - name: lint:deps
        run: pnpm lint:deps

      - name: test
        run: pnpm test

      - name: build
        run: pnpm build

      # 접근성과 대비는 브라우저가 필요 없다 — jsdom과 토큰 계산만 쓴다.
      # 빠르므로 e2e보다 먼저 둔다: 여기서 깨지면 브라우저를 받을 이유가 없다.
      - name: test:a11y
        run: pnpm test:a11y

      - name: test:contrast
        run: pnpm test:contrast

      # e2e는 **실제 브라우저와 빌드된 앱** 둘 다 필요하다.
      # `build`가 위에서 `.next`를 만들었고, Playwright가 `next start`로 띄운다.
      - name: install chromium
        run: pnpm --filter @prs/web exec playwright install --with-deps chromium

      - name: test:e2e
        run: pnpm test:e2e

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: prs_test
          POSTGRES_USER: prs
          POSTGRES_PASSWORD: prs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.19.0
        env:
          discovery.type: single-node
          # CI 전용이다. 운영에서는 보안을 끄지 않는다 (보안 문서 4장).
          xpack.security.enabled: 'false'
          ES_JAVA_OPTS: -Xms1g -Xmx1g
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -fsS http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: prs
      POSTGRES_PASSWORD: prs
      POSTGRES_TEST_DB: prs_test
      ELASTICSEARCH_NODE: http://localhost:9200
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 통합 테스트는 소스를 직접 읽으므로 빌드가 필요 없다 (vitest 별칭).
      - name: test:integration
        run: pnpm test:integration
