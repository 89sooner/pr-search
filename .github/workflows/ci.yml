name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 버전은 package.json의 packageManager가 단일 출처다.
      # 여기에 version을 함께 적으면 action-setup이 중복 지정으로 실패한다.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: typecheck
        run: pnpm typecheck

      - name: lint
        run: pnpm lint

      - name: lint:deps
        run: pnpm lint:deps

      - name: test
        run: pnpm test

      - name: build
        run: pnpm build

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: prs_test
          POSTGRES_USER: prs
          POSTGRES_PASSWORD: prs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: prs
      POSTGRES_PASSWORD: prs
      POSTGRES_TEST_DB: prs_test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 통합 테스트는 소스를 직접 읽으므로 빌드가 필요 없다 (vitest 별칭).
      - name: test:integration
        run: pnpm test:integration
