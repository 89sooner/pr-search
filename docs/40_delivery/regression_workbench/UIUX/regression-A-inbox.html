하면 안 되는 의미\n\nRegression 정본 키는 `(repository, branch, seq_epoch, merge_seq)` 및 full commit SHA다. 기존 `merge_number` / M-number는 PR 친화적인 표시 식별자다. 이번 작업에서 새 counter를 만들거나 기존 M-number 의미를 재정의하지 않는다.\n\n- M-number가 있는 revision은 M을 우선 표시한다.\n- PR 없는 direct push는 `M 없음 · S-<merge_seq>`로 표시하고 전체 범위에 포함한다.\n- 정렬, 거리, midpoint는 M-number 숫자 계산이 아니라 정본 first-parent integration 집합을 따른다.\n- scope가 다른 동일 숫자를 비교하지 않는다. epoch가 바뀌면 기존 판정을 잠근다.\n- baseline은 동일 testcase, failure signature, HW/environment/configuration 및 판정 정책에서 비교 가능한 PASS여야 한다.\n- 실패 날짜는 MDVP 결과 목록을 찾는 필터다. 커밋 목록을 그 날짜로 다시 제한하지 않는다.\n- 범위는 `(PASS, FAIL]`로 표시하며, PR 목록을 '원인 확정' 목록이라고 부르지 않는다.\n- 한 revision의 결과를 해당 구간 모든 PR의 상태로 전파하지 않는다.\n- UI의 영역/검색 필터는 표시에만 적용한다. 후보 집합을 줄이거나 bisect midpoint를 바꾸지 않는다.\n\n## 첫 구현 범위\n\n1. 기존 전역 navigation에 Search와 동등한 Regression 항목 및 `/regression` route를 추가한다. Search의 기능/URL/기존 스타일은 보존한다.\n2. `RegressionDataSource` interface와 fixture adapter를 만든다. 실 API가 확인되기 전에는 mock mode를 UI에 명시한다. 인증정보, 내부 URL, 응답 schema를 임의로 추정하지 않는다.\n3. A안 전체 흐름을 한 vertical slice로 구현한다: 날짜 선택 → MDVP 결과 선택 → PASS/FAIL evidence → integration ribbon → suspect PR list → integration detail sheet.\n4. 기존 bisect API와 상태를 재사용해 후보 조회, 판정, 기록 복원으로 연결한다. API에 없는 verdict는 지원하는 것처럼 보내지 않는다. backend 확장 전에는 SKIP/INCONCLUSIVE 동작을 fixture와 feature flag로 격리한다.\n5. B timeline 및 C matrix는 동일한 selection, query cache, canonical context, session을 사용한다.\n\n## 제안 컴포넌트 분해\n\n실제 repository convention에 맞춰 경로를 정한다. 아래는 새 API 계약이나 실파일 경로의 확인 결과가 아니라 제안이다.\n\n```text\nRegressionRoute\n  RegressionScopeBar\n  RegressionViewSwitcher\n  FailureInbox\n    RunDateFilter\n    RunStatusFilter\n    FailureRunCard\n  InvestigationWorkbench\n    SelectedRunHeader\n    CompatibleBaselineSummary\n    IntegrationRangeRibbon\n    SuspectChangeFilters\n    SuspectChangeTable\n    BisectControlPanel\n    ObservationHistory\n  IntegrationTimelineView\n    FirstParentLane\n    MdvpEvidenceLanes\n    TimelineViewportControls\n  DailyTestMatrixView\n    TestTypeDateMatrix\n    GuidedInvestigationSteps\n  IntegrationDetailSheet\n  MdvpEvidenceSheet\n  SourceHealthBanner\n  RegressionEmptyState\n```\n\n소유권:\n- URL: view, repo, branch, epoch, run, 결과 날짜, 테스트 유형.\n- 서버/cache: run detail, integration mapping, compatible baseline, full canonical candidate set, session revision/version.\n- 로컬 UI: table search, area, pagination, drawer selection, timeline zoom, scroll positions.\n- 관측 기록: immutable observation history + concurrency/version checks. 화면 전환 시 session을 재생성하지 않는다.\n- fixture adapter: 합성 데이터와 로컬 요청 queue. 실제 adapter에서 호출되지 않도록 분리한다.\n\n제안 deep link:\n`/regression?view=inbox&repo=modem%2Fsw&branch=main&epoch=1&run=MDVP-78421&date=2026-09-18`\n\n## Table / Timeline 계약\n\n기본 표: M-number, PR/변경 제목, 영역, 반영 시각(KST), binary 유무, 선택 시험에 대한 판정. SHA 전체/author/파일/diff/manifest/environment/test evidence는 sheet로 보낸다. direct push도 한 행을 차지한다. 기본 최신순이며 반영순 정렬 전환을 제공한다.\n\nTimeline의 기본 x축은 실제 first-parent 순서다. MDVP marker는 시험 완료 시각이 아니라 시험한 revision 위치에 놓는다. 시험 완료일은 tooltip과 evidence panel에 따로 표기한다. PR 없는 커밋, binary 없는 커밋, 다음 후보, PASS/FAIL/보류를 색상뿐 아니라 모양·문자·label로 구별한다. 좁은 구간의 point click과 keyboard focus, zoom, 가로 pan을 지원한다. 다른 testcase의 PASS는 baseline 후보로 자동 채택하지 않는다.\n\n## Bisect / MDVP 행동\n\n- PASS: 확정 근거가 있을 때 lower bound만 이동한다.\n- FAIL: 해당 failure signature에 대한 확정 결과일 때 upper bound만 이동한다.\n- SKIP: 시험 불가 사유를 기록하고 다른 테스트 후보를 제안하되 경계는 유지한다. 원인 후보에서 제거하지 않는다.\n- INCONCLUSIVE: 관측/사유만 기록하고 현재 후보와 경계를 유지한다. 재시험 또는 다른 후보 선택을 제공한다.\n- binary 미보관: 테스트 선택에서만 피한다. 미확정 원인 구간에는 남는다.\n- 시험 가능한 후보가 없고 중간 미확정 변경이 남으면 `blocked / unresolved range`다. 단일 원인으로 표시하지 않는다.\n- 단일 경계에 도달해도 `최초 FAIL 경계 후보 · 재현 확인 필요`로 표시한다. non-monotonic 또는 flaky 결과에서는 자동 수렴을 주장하지 않는다.\n- 실제 테스트 요청은 별도 confirmation에 canonical revision, exact artifact digest, testcase/config/environment를 표시한다. UI prototype의 로컬 큐를 실제 MDVP 실행으로 간주하지 않는다.\n- MTBF: device-hours, failures, test policy/version 및 source-provided verdict를 분리 표시한다. 정책과 confidence 계산이 검증되지 않은 상태에서는 임의 PASS/FAIL이나 confidence 수치를 만들지 않는다.\n\n## 필수 상태와 수용 조건\n\n- 기본 샘플: M-10521 → M-10580. 내부 S-24001 → S-24061. 60 changes = 59 PR + 1 direct push. 실제 API 사용 시 숫자를 하드코딩하지 않는다.\n- 기본 midpoint는 전체 canonical 후보 집합에서 선택된다. 영역/검색/페이지 변경은 midpoint에 영향을 주지 않는다.\n- 날짜를 9월 17일로 바꾸면 해당 일자 MDVP 결과만 보인다. 선택 결과의 변경 범위는 이전 날짜까지 보존된다.\n- PR/M/S/SHA 검색과 정확한 manifest 역추적이 가능하다.\n- FAIL 결과라도 revision 매핑이 없으면 범위 생성/자동 판정을 막는다.\n- MTBF INCONCLUSIVE는 FAIL 색상/진척으로 대체되지 않는다.\n- MDVP stale/offline/epoch stale는 배너와 읽기 전용 동작으로 구별한다.\n- release branch에 main 번호를 가져와 임시 표시하지 않는다.\n- 빈 결과, 로딩, 권한 오류, 연결 오류, 부분 미매핑, artifact unavailable에 각각 상태 UI가 있다. 이 HTML은 loading/permission 오류 backend를 구현한 것이 아니므로 실제 이식 단계에서 채운다.\n- dialog은 native/Radix 등 검증된 focus trap, Escape close, focus restore를 사용한다.\n- reduced-motion을 지원하고 테이블 재정렬에 큰 애니메이션을 사용하지 않는다.\n- 모든 값은 텍스트/아이콘/label을 동반한다. 상태색만으로 판정을 전달하지 않는다.\n\n## 검증 범위\n\n실제 개인 PC 개발환경에 맞춰 필요한 검증만 한다. 장시간 soak이나 대규모 문서 재정리로 UI 구현을 미루지 않는다.\n\n1. 저장소가 이미 사용하는 lint/typecheck/build 및 영향 받는 단위테스트 실행.\n2. 1440px desktop과 390px narrow viewport에서 main flow 확인.\n3. PASS/FAIL로 범위가 좁혀지고 SKIP/보류로는 경계가 이동하지 않는 회귀테스트.\n4. direct push, missing artifact, wrong scope, unmapped run, MTBF inconclusive 테스트.\n5. 기존 Search 진입 및 주요 조회 경로 smoke test.\n\n기능을 로컬 feature flag로 롤아웃하고 기존 Search는 그대로 둔다. 보고에는 실제 변경 파일, 동작하는 사용자 동선, 실행한 검증 결과, 아직 fixture인 부분을 구분한다. 근거 없는 'production-ready' 완료 표현을 사용하지 않는다.\n";</script><script>/* Standalone UI concept lab. All data and mutations are local demo data.

function bisectCard(r,preview=false){if(!r?.admissible)return '';let s=getSession(r),active=!!s;if(!s&&!preview)return '';s=s||previewSession(r);const calc=calculate(s),x=calc.next,initial=r.seq-r.good,progress=100*(1-calc.remaining/initial);let content='';if(calc.state==='converged'){const end=lookup.get(s.hi);content=`<div class="candidate-label">최초 FAIL 경계 후보 · 단조성 가정</div><div class="candidate-id">${rev(s.hi)}</div><p class="small">${end.pr?'PR #'+end.pr:'Direct push · PR 없음'} · 원인 확정 전 재현/검증이 필요합니다.</p><div class="detail-buttons">${btn('변경 상세','integration',`data-seq="${s.hi}"`,'sm')}${btn('조사 내보내기','export','','sm')}</div>`;}
else if(calc.state==='blocked'){content=`<div class="candidate-label">시험 가능한 다음 후보 없음</div><h2 style="margin:8px 0">${calc.remaining}개 변경은 아직 미확정입니다.</h2><p class="small">SKIP, 판정 보류, binary 미보관은 원인 후보에서 제거되지 않습니다. 단일 원인으로 확정하지 않습니다.</p><div style="margin-top:12px">${btn('미보관 후보 확인','area','data-value="missing"','sm')}</div>`;}
else {content=`<div class="bisect-main"><div><div class="candidate-label">${active?'NEXT TEST CANDIDATE':'MIDPOINT PREVIEW'}</div><div class="candidate-id">${rev(x.seq)}</div><div class="candidate-note">${x.pr?'PR #'+x.pr:'Direct push'} · S-${x.seq} · ${icon('box')} binary ready</div></div>${btn(icon('play')+(state.queue.some(q=>q.run===r.id&&q.seq===x.seq)?'재시험 요청 (데모)':'MDVP 요청 (데모)'),'request',!active||!available()?'disabled':'','sm')}</div>${active?`<div class="verdict-buttons">${btn(icon('check')+'PASS','mark','data-verdict="PASS" '+(!available()?'disabled':''),'pass')}${btn(icon('cross')+'FAIL','mark','data-verdict="FAIL" '+(!available()?'disabled':''),'fail')}${btn(icon('skip')+'SKIP','mark','data-verdict="SKIP" '+(!available()?'disabled':''))}${btn(icon('pause')+'보류','mark','data-verdict="INCONCLUSIVE" '+(!available()?'disabled':''))}</div>${calc.state==='inconclusive'?`<div class="evidence-alert">판정 보류: 경계를 이동하지 않았습니다. 같은 빌드를 재시험하거나 ${btn('다른 후보','defer',!available()?'disabled':'','sm')}를 선택하세요.</div>`:'<p class="tiny muted">버튼은 로컬 데모 판정입니다. 실제 시험 결과가 생성되지는 않습니다.</p>'}`:`<div style="margin-top:16px">${btn(icon('target')+'이 구간 Bisect 시작','start',!available()?'disabled':'','primary block')}</div>`}`;}
return `<section class="bisect-card" id="bisect-panel" aria-label="Bisect 세션"><div class="bisect-top"><h3>${icon('target')}${active?'Bisect session':'Narrow the range'}</h3><span class="badge outline mono">${active?s.history.length:'0'} tests</span></div><div class="bisect-content">${content}<div class="progress-track" aria-label="후보 감소율 ${Math.round(progress)}%"><div style="width:${Math.max(0,progress)}%"></div></div>${active&&s.history.length?`<div class="history-items">${s.history.slice(-5).map(h=>`<span class="history-item ${h.verdict.toLowerCase()}">${rev(h.seq)} ${h.verdict==='PASS'?'✓':h.verdict==='FAIL'?'×':h.verdict==='SKIP'?'↦':'Ⅱ'} ${h.verdict}</span>`).join('')}</div>`:''}<div class="bisect-foot"><span>${calc.remaining}개 후보 · ${calc.state==='active'?'이상적 약 '+Math.ceil(Math.log2(Math.max(1,calc.remaining)))+'회 추가':'미확정은 원인과 구별'}</span>${active?`<div class="flex">${btn(icon('undo'),'undo',(!s.snapshots.length||!available()?'disabled ':'')+'title="마지막 판정 취소" aria-label="마지막 판정 취소"','sm icon-only')}${btn('기록','session-log','','sm')}${btn('초기화','session-reset',!available()?'disabled':'','sm')}</div>`:''}</div></div></section>`;}
function inboxView(){const r=currentRun();return `<div class="inbox-layout">${queue()}<main class="work-scroll" data-scroll="work">${r?investigationHead(r)+warningForRun(r)+evidenceStrip(r)+ribbon(r)+bisectCard(r)+(bounds(r)?rangeTable(r):''):emptyWork()}</main></div>`;}
function timelineMap(r){const original=bounds(r,true);if(!original)return `<div class="panel">${emptyWork()}</div>`;const b=bounds(r),s=getSession(r),calc=r.admissible?calculate(s||previewSession(r)):null;let arr=state.focusRange?DATA.integrations.filter(x=>x.seq>=original.lo&&x.seq<=original.hi):DATA.integrations;const width=940*state.zoom,left=104,right=42,inner=width-left-right,xpos=seq=>left+arr.findIndex(x=>x.seq===seq)/Math.max(1,arr.length-1)*inner;const index=new Set(arr.map(x=>x.seq));const ticks=arr.filter((_x,i)=>i%Math.max(1,Math.ceil(arr.length/8))===0);if(ticks[ticks.length-1]!==arr[arr.length-1])ticks.push(arr[arr.length-1]);const laneY={Regression:169,Field:226,MTBF:283};const pins=DATA.runs.filter(rr=>index.has(rr.seq));
return `<section class="panel map-panel"><div class="map-header"><div><h2>Integration map</h2><p class="tiny" style="margin-top:3px">순서 위에 시험 결과를 연결합니다.</p></div><div class="flex"><button class="btn sm ${state.focusRange?'':'ghost'}" data-action="map-focus">${state.focusRange?'선택 구간':'전체 이력'}</button><div class="segmented"><button data-action="zoom" data-delta="-1" ${state.zoom===1?'disabled':''} aria-label="타임라인 축소">−</button><span class="mono tiny" style="padding:5px 7px">${state.zoom}×</span><button data-action="zoom" data-delta="1" ${state.zoom===4?'disabled':''} aria-label="타임라인 확대">+</button></div></div></div><div class="map-scroll" data-scroll="map"><div class="map-stage" style="width:${state.zoom*100}%;min-width:${state.zoom*690}px"><svg class="graph-svg" viewBox="0 0 ${width} 340" role="group" aria-label="first-parent integration 순서 및 MDVP 결과 타임라인"><rect x="${xpos(b.lo)}" y="52" width="${Math.max(1,xpos(b.hi)-xpos(b.lo))}" height="260" class="range-fill" rx="5"/>
${ticks.map(x=>`<line x1="${xpos(x.seq)}" y1="51" x2="${xpos(x.seq)}" y2="309" class="grid-line"/><text x="${xpos(x.seq)}" y="30" text-anchor="middle" class="mono-text">${rev(x.seq)}</text><text x="${xpos(x.seq)}" y="325" text-anchor="middle" style="font-size:9px">${x.integrated_at.slice(5,10).replace('-','/')} ${x.integrated_at.slice(11,16)}</text>`).join('')}
<text x="18" y="83" class="lane-label">MAIN</text><text x="18" y="97" style="font-size:8px">first-parent</text><line x1="${left}" y1="90" x2="${width-right}" y2="90" class="base-line"/>
${Object.entries(laneY).map(([name,y])=>`<text x="18" y="${y+4}" class="lane-label">${name.toUpperCase()}</text><line x1="${left}" y1="${y}" x2="${width-right}" y2="${y}" class="base-line" style="stroke-width:1"/>`).join('')}
${arr.map(x=>{const o=observed(x.seq,r),color=o==='PASS'?'var(--pass)':o==='FAIL'?'var(--fail)':o==='SKIP'||o==='INCONCLUSIVE'?'var(--warn)':'var(--muted)',p=xpos(x.seq),hit=Math.min(14,inner/Math.max(1,arr.length-1)*.8);return `<g role="button" tabindex="0" aria-label="${rev(x.seq)}, ${x.direct?'PR 없는 커밋':x.title}, ${o}" class="node-button" data-action="integration" data-seq="${x.seq}"><title>${rev(x.seq)} / S-${x.seq} · ${x.pr?'PR #'+x.pr:'Direct push'} · ${o}</title><rect x="${p-hit/2}" y="73" width="${hit}" height="34" rx="4" class="node-hit"/><rect x="${p-3.5}" y="86.5" width="7" height="7" rx="${x.direct?0:1.5}" fill="${x.artifact?color:'var(--panel)'}" stroke="${color}" ${!x.artifact?'stroke-dasharray="2 1"':''} ${x.direct?`transform="rotate(45 ${p} 90)"`:''}/></g>`;}).join('')}
${pins.map(rr=>{const p=xpos(rr.seq),y=laneY[rr.type],color=rr.status==='FAIL'?'var(--fail)':rr.status==='PASS'?'var(--pass)':'var(--warn)',selected=rr.id===r.id,relevant=rr.signature===r.signature;return `<g role="button" tabindex="0" aria-label="${rr.id} ${rr.title} ${rr.status}, ${rev(rr.seq)}" data-action="run" data-run="${rr.id}" class="node-button" opacity="${relevant?'1':'.55'}"><title>${rr.id} · ${rr.title} · ${rr.status}\n시험한 빌드 ${rev(rr.seq)}\n결과 완료 ${rr.date} ${rr.time} KST</title>${selected?`<line x1="${p}" y1="101" x2="${p}" y2="${y-12}" stroke="${color}" stroke-dasharray="3 3"/>`:''}<rect x="${p-13}" y="${y-15}" width="26" height="32" rx="5" class="node-hit"/><circle cx="${p}" cy="${y}" r="${selected?10:8}" fill="var(--panel)" stroke="${color}" stroke-width="${selected?2:1.4}" ${rr.status==='INCONCLUSIVE'?'stroke-dasharray="3 2"':''}/><text x="${p}" y="${y+3}" text-anchor="middle" style="fill:${color};font-size:10px">${rr.status==='PASS'?'✓':rr.status==='FAIL'?'×':'Ⅱ'}</text><text x="${p}" y="${y+25}" text-anchor="middle" class="run-text">${rr.id.replace('MDVP-','#')}</text></g>`;}).join('')}

</svg></div></div><div class="map-foot">${legend()}<span class="tiny muted">${arr.length} revisions · 가로 스크롤 / 확대</span></div><p class="map-caption">X축은 실제 반영 순서입니다. MDVP 마커는 시험 완료 시각이 아니라 시험한 binary의 revision 위치에 놓입니다.</p></section>`;}
function sourceCard(r){return `<section class="panel source-card"><div class="between"><span class="eyebrow">SELECTED EVIDENCE</span>${badge(r.status,r.status==='INCONCLUSIVE'?'보류':r.status)}</div><h3>${esc(r.title)}</h3><div class="mono small muted">${r.id}</div><div class="source-field"><span>시험한 빌드</span><span class="mono">${rev(r.seq)}</span></div><div class="source-field"><span>결과 완료 · KST</span><span>${r.date.slice(5)} ${r.time}</span></div><div class="source-field"><span>Test type</span><span>MDVP / ${r.type}</span></div><div class="source-field"><span>Environment</span><span>${esc(r.environment)}</span></div>${btn('시험 결과 · 비교 근거 '+icon('chevron'),'run-detail','','sm block')}</section>`;}

function matrix(){const days=['2026-09-14','2026-09-15','2026-09-16','2026-09-17','2026-09-18'];return `<section class="panel matrix-panel" aria-label="날짜와 테스트 유형별 MDVP 결과"><div class="matrix-title"><div><h2>MDVP test calendar</h2><p class="tiny" style="margin-top:3px">날짜 × 테스트 유형을 눌러, 그날의 결과로 이동합니다.</p></div><div class="flex"><span class="badge outline">2026.09.14 — 09.18</span>${btn(icon('calendar'),'daily-all','title="선택 날짜 전체 테스트 유형" aria-label="전체 테스트 유형"','sm icon-only')}</div></div><div class="matrix-table"><div class="matrix-head" style="text-align:left;padding-left:20px">LIVE TEST</div>${days.map((d,i)=>`<button class="matrix-head ${state.date===d?'today':''}" data-action="matrix" data-date="${d}" data-type="all">${d.slice(5).replace('-','.')} <span class="tiny">${['MON','TUE','WED','THU','FRI'][i]}</span></button>`).join('')}${['Regression','Field','MTBF'].map(t=>`<div class="matrix-row-label">${icon(t==='Regression'?'pulse':t==='Field'?'target':'clock')}${t}</div>${days.map(d=>{const runs=DATA.runs.filter(rr=>rr.date===d&&rr.type===t),f=runs.filter(rr=>rr.status==='FAIL').length,inc=runs.filter(rr=>rr.status==='INCONCLUSIVE').length;let st=f?'FAIL':inc?'INCONCLUSIVE':runs.length?'PASS':'NONE',count=f||inc||runs.length;return `<button class="matrix-cell ${st.toLowerCase()} ${state.date===d&&(state.type==='all'||state.type===t)?'selected':''}" data-action="matrix" data-date="${d}" data-type="${t}" data-status="${st}" aria-label="${d} ${t}, ${st==='NONE'?'결과 없음':count+' '+st}" aria-pressed="${state.date===d&&(state.type==='all'||state.type===t)}">${st==='NONE'?'<span>—</span>':`${icon(statusIcon(st))}<span class="cell-count">${count}</span><span class="cell-label">${st==='INCONCLUSIVE'?'보류':st}</span>`}</button>`;}).join('')}`).join('')}</div><div class="matrix-bottom"><span>✓ PASS · × FAIL · Ⅱ 판정 보류 · — 기록 없음</span><span>날짜는 시험 완료일 · KST / MTBF는 MDVP의 테스트 유형입니다.</span></div></section>`;}
function pulseCase(r){if(!r)return `<section class="panel">${emptyWork()}</section>`;const active=!!getSession(r);return `<section class="panel case-panel"><div class="case-steps"><button class="case-step done" data-action="step" data-step="1"><span class="step-num">✓</span>실패 선택</button><button class="case-step ${state.pulseStep===2?'active':'done'}" data-action="step" data-step="2"><span class="step-num">02</span>변경 구간 확인</button><button class="case-step ${state.pulseStep===3?'active':''}" data-action="step" data-step="3" ${!r.admissible?'disabled':''}><span class="step-num">03</span>후보 검증</button></div><div class="case-content">${investigationHead(r,true)}${warningForRun(r)}${evidenceStrip(r)}${state.pulseStep===3&&active?bisectCard(r):ribbon(r)}${bounds(r)?rangeTable(r,true):''}</div><div class="case-bottom"><span>${active?'이 조사 세션은 다른 후보 화면에서도 이어집니다.':'원인 추정 점수 대신, 비교 가능한 시험과 실제 변경 범위를 사용합니다.'}</span>${btn(icon('target')+(active?'검증 세션 이어가기':'이 구간 검증하기'),'start',!r.admissible||!available()?'disabled':'','primary')}</div></section>`;}
function pulseView(){const all=DATA.runs.filter(r=>r.date===state.date),fails=all.filter(r=>r.status==='FAIL').length,inc=all.filter(r=>r.status==='INCONCLUSIVE').length,unmapped=all.filter(r=>!r.seq).length,r=currentRun();return `<main class="pulse-main"><div class="pulse-top"><div><div class="eyebrow" style="margin-bottom:9px">DAILY PULSE / MDVP REGRESSION</div><h1>9월 ${Number(state.date.slice(-2))}일, 무엇이 달라졌나요?</h1><p>오늘의 시험 실패에서, 원인이 들어온 integration 구간으로.</p></div><div class="pulse-metrics"><div class="metric"><div class="metric-value" style="color:var(--fail)">${String(fails).padStart(2,'0')}</div><div class="metric-label">FAIL 결과</div></div><div class="metric"><div class="metric-value" style="color:var(--warn)">${String(inc).padStart(2,'0')}</div><div class="metric-label">판정 보류</div></div><div class="metric"><div class="metric-value">${String(unmapped).padStart(2,'0')}</div><div class="metric-label">Revision 미매핑</div></div></div></div>${matrix()}<div class="pulse-grid"><aside class="daily-failures"><div class="section-heading"><div><h2>${state.date.slice(5).replace('-','.')} · ${state.type==='all'?'전체 테스트':state.type}</h2><div class="sub">${state.status==='all'?'전체 결과':'조사 필요 결과'} ${filteredRuns().length}건</div></div>${btn(icon('refresh'),'daily-all','title="필터 초기화" aria-label="날짜 필터 초기화"','sm icon-only')}</div><div class="daily-run-list" data-scroll="daily">${filteredRuns().map(runCard).join('')||'<div class="panel empty-state"><p>이 날짜와 유형에 해당하는 결과가 없습니다.</p></div>'}</div><p class="contrast-note">날짜는 실패를 찾기 위한 필터입니다.<br>PR 목록은 마지막 PASS 이후의 전체 반영 구간을 따릅니다.</p></aside>${pulseCase(r)}</div></main>`;}
function render(){const positions={};document.querySelectorAll('[data-scroll]').forEach(el=>positions[el.dataset.scroll]={top:el.scrollTop,left:el.scrollLeft});const active=document.activeElement,focusId=active?.id,selection=active?.selectionStart;document.body.className='concept-'+state.view;document.title=`${DESIGNS.find(d=>d.id===state.view).name} · pr-search Regression`;
 $('#app').innerHTML=header()+(state.branch!=='main'?`<main style="min-height:70vh">${emptyWork()}</main>`:state.view==='inbox'?inboxView():state.view==='atlas'?atlasView():pulseView())+footer();document.querySelectorAll('[data-scroll]').forEach(el=>{const pos=positions[el.dataset.scroll];if(pos){el.scrollTop=pos.top;el.scrollLeft=pos.left;}});if(focusId&&document.getElementById(focusId)){const el=document.getElementById(focusId);el.focus({preventScroll:true});try{if(selection!=null)el.setSelectionRange(selection,selection);}catch(_e){}}save();}
let returnFocus=null;
function modal(title,html,{drawer=false,footer=''}={}){const d=$('#modal');returnFocus=document.activeElement;d.className=drawer?'drawer':'';d.innerHTML=`<div class="dialog-heading"><h2 id="dialog-title">${title}</h2><button class="btn ghost icon-only" data-action="close-modal" aria-label="닫기">${icon('cross')}</button></div><div class="dialog-content">${html}</div>${footer?`<div class="dialog-footer">${footer}</div>`:''}`;d.setAttribute('aria-labelledby','dialog-title');if(!d.open)d.showModal();}
function closeModal(){const d=$('#modal');if(d.open)d.close();if(returnFocus?.isConnected)returnFocus.focus({preventScroll:true});}
let toastTimer;
function toast(text){const el=$('#toast');el.innerHTML=icon('info')+`<span>${esc(text)}</span>`;el.classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('visible'),4200);}
function download(name,text,type='text/plain;charset=utf-8'){const blob=new Blob([text],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);}
async function copyText(text){try{await navigator.clipboard.writeText(text);toast('클립보드에 복사했습니다.');}catch(_e){const area=document.createElement('textarea');area.value=text;area.style.cssText='position:fixed;top:0;left:0;opacity:0';document.body.appendChild(area);area.focus();area.select();let ok=false;try{ok=document.execCommand('copy');}catch(_e){}area.remove();if(ok)toast('클립보드에 복사했습니다.');else modal('복사할 내용',`<textarea class="control" readonly>${esc(text)}</textarea><p class="small" style="margin-top:12px">브라우저가 클립보드를 제한했습니다. 텍스트를 선택해 직접 복사하세요.</p>`);}}
function openIntegration(seq){const x=lookup.get(seq),r=currentRun();if(!x)return;const o=observed(seq,r),filename=`SMP1900-main-E1-S${x.seq}-${x.sha.slice(0,7)}.bin`;
modal('Integration detail',`<div class="between"><span class="eyebrow">MAIN / E1 · ${x.direct?'DIRECT PUSH':'PR INTEGRATION'}</span>${badge(o,o==='UNKNOWN'?'미시험':o==='INCONCLUSIVE'?'판정 보류':o)}</div><div class="detail-revision" style="margin-top:15px">${rev(seq)}</div><div class="detail-title">${esc(x.title)}</div><div class="flex">${x.pr?`<span class="badge candidate mono">PR #${x.pr}</span>`:'<span class="badge inconclusive">PR 연결 없음</span>'}<span class="area">${x.area}</span><span class="small muted">${esc(x.author)}</span></div><dl class="detail-grid"><dt>Canonical sequence</dt><dd class="mono">S-${x.seq} · main · E1</dd><dt>M-number</dt><dd class="mono">${x.m?'M-'+x.m:'없음 — 번호를 소비하지 않는 direct push'}</dd><dt>반영 시각 · KST</dt><dd class="mono">${x.integrated_at.slice(0,10)} ${x.integrated_at.slice(11,16)}</dd><dt>Git revision</dt><dd class="mono">${x.sha}</dd><dt>변경량</dt><dd>${x.files} files · <span style="color:var(--pass)">+${x.additions}</span> / <span style="color:var(--fail)">−${x.deletions}</span></dd><dt>Binary</dt><dd>${x.artifact?'보관됨 · '+x.build:'미보관 · 시험 후보 선택에서 제외'}</dd></dl><div class="detail-block"><div class="label">ARTIFACT MANIFEST · MOCK</div><code>${filename}</code>${x.artifact?`<div class="label" style="margin-top:10px">SHA-256</div><code>${x.digest}</code>`:''}</div>${!x.artifact?'<div class="evidence-alert">Binary가 없다는 이유로 원인 후보에서 제거하지 않습니다. 해당 revision을 시험하려면 먼저 재빌드가 필요합니다.</div>':''}${x.direct?'<div class="evidence-alert">실제 main 변경이므로 regression 구간에 포함합니다. M-number가 없는 이 행은 S-number를 보조 식별자로 표시합니다.</div>':''}<h3>변경 파일 · 샘플 diff</h3><p class="tiny">아래 diff는 시연용입니다. 실제 저장소 코드가 아닙니다.</p><div class="diff"><div class="file">${esc(x.file)}</div><div class="line">@@ sample changes @@</div><div class="line deleted">− apply_config(current_profile);</div><div class="line added">+ if (is_profile_compatible(current_profile)) {</div><div class="line added">+   apply_config(current_profile);</div><div class="line added">+ }</div></div><div class="explanation">이 행이 의심 구간에 포함되었다는 사실은 인과관계가 입증되었다는 뜻이 아닙니다. 시험 결과는 현재 선택한 failure signature에만 적용됩니다.</div><div class="detail-buttons">${btn(icon('copy')+'SHA 복사','copy-sha',`data-seq="${seq}"`,'sm')}${btn(icon('download')+'Manifest 저장','manifest',`data-seq="${seq}"`,'sm')}${!x.artifact?btn('재빌드 요청 (데모)','build-request',`data-seq="${seq}" ${!available()?'disabled':''}`,'sm'):''}</div>`,{drawer:true});}
function openRunDetail(){const r=currentRun();if(!r)return;const baseline=findRun(r.baseline);const x=lookup.get(r.seq);modal('MDVP test evidence',`<div class="between"><span class="mono muted small">${r.id}</span>${badge(r.status,r.status==='INCONCLUSIVE'?'판정 보류':r.status)}</div><div class="detail-title">${esc(r.title)}</div><div class="eyebrow">LIVE TEST / ${r.type.toUpperCase()} · COMPLETED</div><div class="support-metrics"><div class="support-cell"><div class="value">${r.device_hours}</div><div class="label">device-hours</div></div><div class="support-cell"><div class="value">${r.failures}</div><div class="label">observed failures</div></div><div class="support-cell"><div class="value">${r.devices}</div><div class="label">devices</div></div></div><dl class="detail-grid"><dt>시험한 revision</dt><dd class="mono">${rev(r.seq)} ${r.seq?'/ S-'+r.seq:''}</dd><dt>Failure signature</dt><dd class="mono">${esc(r.signature)}</dd><dt>완료 시각 · KST</dt><dd>${r.date} ${r.time}</dd><dt>Test environment</dt><dd>${esc(r.environment)}</dd><dt>Configuration</dt><dd class="mono">${esc(r.config)}</dd><dt>Source</dt><dd>MDVP adapter fixture · 샘플</dd><dt>실행 상태</dt><dd>COMPLETED</dd><dt>판정 상태</dt><dd>${r.status}</dd></dl>${r.type==='MTBF'?`<div class="evidence-alert">MTBF는 MDVP 내 안정성 시험 유형입니다. 관측 실패 수와 누적 운용 시간만으로 임의 PASS/FAIL을 계산하지 않습니다. 이 데모에는 판정 정책·confidence 모델이 연결되지 않았습니다.</div><div class="detail-block"><div class="label">정책 / 신뢰구간</div><span>미연결 · MDVP 원문 판정 ${r.status} 표시</span></div>`:''}${!x?`<div class="evidence-alert">${esc(r.reason)} 날짜 또는 PR 번호로 revision을 추정하지 않습니다.</div>`:''}${baseline?`<h3>Last compatible PASS</h3><div class="detail-block"><div class="between">${badge('PASS')}<span class="mono">${rev(baseline.seq)}</span></div><p class="small" style="margin-top:10px">${baseline.id} · ${baseline.date} ${baseline.time} KST</p><p class="small">동일 testcase / failure signature / HW / environment / configuration</p></div><div class="explanation">PASS는 범위에서 제외하고 선택한 ${r.status==='FAIL'?'FAIL':'판정 보류'} 빌드까지 포함합니다. 시작·종료 날짜로 커밋을 잘라내지 않습니다.</div>`:''}<div class="detail-buttons">${x?btn('시험한 빌드 상세','integration',`data-seq="${x.seq}"`,'sm'):''}${btn(icon('download')+'수신 JSON 저장','run-json','','sm')}</div>`,{drawer:true});}
function compareModal(){modal('세 가지 조사 동선, 하나의 데이터',`<p>색상만 바꾼 화면이 아닙니다. 실패·반영 순서·날짜 중 무엇을 먼저 보느냐에 따라 정보구조를 다르게 구성했습니다. 화면을 전환해도 선택한 시험과 로컬 bisect 기록은 유지됩니다.</p><div class="compare-grid">${DESIGNS.map((d,i)=>`<div class="compare-card ${!i?'recommended':''}"><div class="between"><span class="eyebrow">CONCEPT ${d.letter}</span>${!i?'<span class="badge candidate">기본 메뉴 추천</span>':''}</div><h3>${d.name}</h3><div class="small muted">${d.tag}</div><div class="compare-wire">${i===0?'[실패 목록] [선택한 실패      ]\n[날짜 필터] [PASS ─── FAIL    ]\n[MDVP run ] [PR 목록 / 상세  ]':i===1?'[      Integration map       ]\n[main  ──────●─────────×      ]\n[MDVP  ✓      Ⅱ        ×     ]\n[PR 목록     ] [Bisect 제어   ]':'[날짜 × 테스트 유형 매트릭스 ]\n[  ✓   ✓   ×   Ⅱ   ×       ]\n[오늘의 실패] [01 → 02 → 03 ]\n[MDVP run  ] [변경 구간 확인]'} </div><p>${d.description}</p>${btn(d.letter+'안 열기 '+icon('chevron'),'view',`data-view="${d.id}"`,'sm '+(!i?'primary':''))}</div>`).join('')}</div><div class="explanation">추천 조합: A를 기본 Regression 메뉴로, B를 조사 상세의 Timeline view로, C를 날짜별 운영 보기로 사용합니다. 세 개를 별도 제품으로 만들 필요는 없습니다.</div><div class="detail-buttons">${btn('Claude 구현 지시서 저장','handoff','','primary')}${btn('데모 동작 / 데이터 원칙','notes','','')}</div>`);}
function notesModal(){modal('Prototype scope & design notes',`<p>기존 개발 검토 보고서와 대화의 UI 요구사항을 바탕으로 만든 독립형 프런트엔드 시제품입니다. 실제 pr-search 저장소 수정, MDVP 연결, GitHub 조회, 시험 실행은 수행하지 않습니다.</p><h3>같은 데이터로 비교하는 세 가지 레이아웃</h3><p>A: 285px Failure Inbox + investigation pane<br>B: Integration map + 302px bisect console<br>C: 날짜 × 테스트 유형 matrix + failure list + 단계별 case panel</p><h3>식별자를 섞지 않습니다.</h3><div class="detail-block mono small">화면: M-number (PR 반영 순서)<br>정본: repository / branch / seq_epoch / merge_seq<br>정확한 revision: full commit SHA<br>PR 없음: M-number 없이 S-number로 표시</div><p>데모 기본 범위는 <span class="mono">M-10521 → M-10580</span>입니다. 내부적으로는 <span class="mono">S-24001 → S-24061</span>이며, 60개 변경 중 1개는 direct push입니다. 새 counter나 M-number 재정의는 하지 않습니다.</p><h3>직접 조작할 수 있는 것</h3><ul class="notes-list"><li>날짜/유형/상태 → MDVP 결과 선택 → 의심 구간과 PR 목록</li><li>M-number·PR·제목·SHA 검색, 영역 필터, 순서 정렬, 페이지 이동</li><li>Integration detail drawer, 샘플 diff, artifact manifest / JSON / CSV 저장</li><li>Bisect PASS / FAIL / SKIP / 판정 보류, 재시험 데모, 판정 취소와 기록</li><li>타임라인 확대/축소/전체 이력, matrix의 날짜·유형 교차 선택</li></ul><h3>데이터와 판정 안전장치</h3><p>시험 완료 날짜와 integration 범위는 별개입니다. 미매핑 결과·비교 가능한 PASS 부재·MTBF 판정 보류는 자동 bisect를 막습니다. 표시 필터는 후보를 제거하지 않습니다. SKIP/보류/binary 미보관은 원인 후보에 남고, 단일 경계에 도달해도 실제 원인 확정을 주장하지 않습니다.</p><h3>레퍼런스의 적용 범위</h3><p>Dark Design: B안의 저채도 dark surface 계층<br>Macapp Supply: A안의 app-like 밀도와 분리된 pane<br>Layers: C안의 절제된 typographic hierarchy<br>shadcn/ui: 실제 React 이식 시 Data Table / Sheet / Tabs / Resizable 매핑 후보</p><p class="small" style="margin-top:10px">공개 페이지를 참고해 재해석한 독자적인 구성입니다. 원본 템플릿·유료 자산·외부 폰트는 포함하지 않습니다.</p><div class="detail-buttons">${btn('후보 비교','compare','','primary')}${btn('Claude 지시서 저장','handoff','','')}${btn('예외 상태 재현','settings','','')}</div>`);}
function settingsModal(){modal('데모 상태 재현',`<p>모든 상태 전환은 브라우저 안에서만 동작합니다. 외부 시스템 상태를 바꾸지 않습니다.</p><label class="form-label" for="mode-control">MDVP / Sequence 상태</label><select id="mode-control" class="control" style="width:100%">${[['ready','정상 샘플 · 로컬 판정 가능'],['stale','MDVP 데이터 지연 · 읽기 전용'],['offline','MDVP 연결 오류 · 캐시 보기'],['epoch','History epoch 변경 · 기존 판정 잠금']].map(([v,l])=>`<option value="${v}" ${state.mode===v?'selected':''}>${l}</option>`).join('')}</select><div class="explanation">revision 미매핑은 “Unresolved binary” 실행, MTBF 보류는 “Overnight stability” 실행을 선택하면 볼 수 있습니다. release 브랜치에는 데이터 없음 상태가 준비되어 있습니다.</div><h3>로컬 데모 저장소</h3><p>Bisect 세션 ${Object.keys(state.sessions).length}개 · 테스트/빌드 요청 ${state.queue.length}개<br>지원되는 브라우저에서는 localStorage에 저장됩니다. 민감한 사용자 데이터는 포함하지 않습니다.</p><div class="detail-buttons">${btn('요청 큐 보기','queue','','sm')}${btn('모든 데모 기록 초기화','reset-all','','sm')}</div>`,{footer:btn('닫기','close-modal','','')+btn('상태 적용','apply-mode','','primary')});}

function downloadCSV(){const rows=filteredChanges(),cols=['M-number','merge_seq','branch','seq_epoch','commit_sha','PR','title','area','integrated_at_KST','artifact_available','test_status'];const encode=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const text=[cols,...rows.map(x=>[x.m?'M-'+x.m:'',x.seq,'main',1,x.sha,x.pr??'',x.title,x.area,x.integrated_at,x.artifact,observed(x.seq)])].map(row=>row.map(encode).join(',')).join('\r\n');download('regression-suspect-changes.csv','\ufeff'+text,'text/csv;charset=utf-8');toast('현재 표시 필터가 적용된 CSV를 저장했습니다.');}
function requestModal(){const r=currentRun(),s=getSession(r);if(!s||!available())return;const next=calculate(s).next;if(!next)return;modal('MDVP 테스트 요청 · 로컬 데모',`<span class="badge inconclusive">실제 시험은 실행되지 않습니다.</span><div class="detail-revision" style="margin-top:15px">${rev(next.seq)}</div><p style="margin:13px 0">선택한 failure signature와 동일한 시험 설정으로 요청할 내용을 확인합니다.</p><div class="detail-block mono small">${esc(r.signature)}<br>${esc(r.environment)}<br>${esc(r.config)}<br>main / E1 / S-${next.seq}<br>${next.sha}</div><p class="small">실제 연동에서는 artifact digest, testcase version, environment fingerprint를 검증한 뒤 adapter로 전송해야 합니다.</p>`,{footer:btn('취소','close-modal')+btn('데모 요청 큐에 추가','confirm-request',`data-seq="${next.seq}"`,'primary')});}
function sessionLog(){const r=currentRun(),s=getSession(r);if(!s)return;modal('Bisect 기록 · 로컬 데모',`<div class="between"><span class="mono">${r.id}</span><span class="badge outline">${s.history.length} observations</span></div><div class="explanation">이 기록은 UI 시연용 수동 판정입니다. MDVP의 실제 관측 결과를 대신하지 않습니다.</div><div class="results-list">${s.history.map((h,i)=>`<div class="result-item"><div><span class="mono">${i+1}. ${rev(h.seq)} / S-${h.seq}</span><p class="tiny" style="margin-top:5px">${esc(h.reason||'사용자 데모 판정')} · ${esc(h.note||'')}</p></div>${badge(h.verdict,h.verdict==='INCONCLUSIVE'?'판정 보류':h.verdict)}</div>`).join('')||'<p>아직 입력한 판정이 없습니다.</p>'}</div>`,{drawer:true});}
function mark(verdict,reason='',note=''){const r=currentRun(),s=getSession(r);if(!s||!available()||!r.admissible)return;const calc=calculate(s),x=calc.next;if(!x)return;if((verdict==='SKIP'||verdict==='INCONCLUSIVE')&&!reason){modal(verdict==='SKIP'?'시험 불가 사유 기록':'판정 보류 근거 기록',`<p><span class="mono">${rev(x.seq)}</span>는 원인 후보에 남습니다. PASS/FAIL 경계는 이동하지 않습니다.</p><label class="form-label" for="verdict-reason">사유</label><select id="verdict-reason" class="control" style="width:100%">${(verdict==='SKIP'?[['equipment_unavailable','장비 사용 불가'],['environment_incompatible','환경 / 설정 비호환'],['build_unusable','빌드 시험 불가']]:[['insufficient_evidence','관측량 / 판정 근거 부족'],['flaky_result','상충하거나 불안정한 결과'],['test_interrupted','시험 중단']]).map(([v,l])=>`<option value="${v}">${l}</option>`).join('')}</select><label class="form-label" for="verdict-note">메모 (선택)</label><textarea id="verdict-note" class="control" placeholder="재시험에 필요한 조건이나 확인 사항"></textarea>`,{footer:btn('취소','close-modal')+btn('데모 판정 기록','confirm-mark',`data-verdict="${verdict}"`,'primary')});return;}
 const snapshot={lo:s.lo,hi:s.hi,excluded:[...s.excluded],deferred:[...s.deferred],waiting:s.waiting,history:s.history.map(h=>({...h}))};s.snapshots.push(snapshot);
 if(verdict==='PASS'){s.lo=x.seq;s.waiting=null;}else if(verdict==='FAIL'){s.hi=x.seq;s.waiting=null;}else if(verdict==='SKIP'){if(!s.excluded.includes(x.seq))s.excluded.push(x.seq);s.waiting=null;}else if(verdict==='INCONCLUSIVE'){s.waiting=x.seq;}
 s.history.push({seq:x.seq,canonical:canonical(x.seq),verdict,reason,note,source:'LOCAL_DEMO_MANUAL',recorded_at:new Date().toISOString()});state.page=1;closeModal();render();toast(verdict==='INCONCLUSIVE'?'판정 보류를 기록했습니다. 경계와 현재 후보를 유지합니다.':verdict==='SKIP'?'시험 불가를 기록했습니다. 경계는 유지하고 다른 후보를 선택합니다.':`${rev(x.seq)} ${verdict} · 로컬 데모 범위를 갱신했습니다.`);}
function startSession(){const r=currentRun();if(!r?.admissible||!available())return;if(!getSession(r))state.sessions[r.id]=previewSession(r);state.pulseStep=3;render();$('#bisect-panel')?.scrollIntoView({behavior:'auto',block:'nearest'});}
function eventAction(el){const action=el.dataset.action;if(el.disabled)return;const r=currentRun(),s=getSession(r);
 switch(action){
 case 'view':state.view=el.dataset.view;state.pulseStep=getSession()?3:2;closeModal();render();break;
 case 'home':normalizeSelection();render();break;
 case 'run':selectRun(el.dataset.run);break;
 case 'status':state.status=el.dataset.value;normalizeSelection();render();break;
 case 'area':state.area=el.dataset.value;state.page=1;render();break;
 case 'clear-filters':state.query='';state.area='all';state.page=1;render();break;
 case 'order':state.order=state.order==='desc'?'asc':'desc';state.page=1;render();break;
 case 'page':state.page+=Number(el.dataset.delta);render();break;
 case 'integration':openIntegration(Number(el.dataset.seq));break;
 case 'run-detail':openRunDetail();break;
 case 'compare':compareModal();break;
 case 'notes':notesModal();break;
 case 'settings':settingsModal();break;
 case 'close-modal':closeModal();break;
 case 'apply-mode':state.mode=$('#mode-control').value;closeModal();render();break;
 case 'reset-scope':state.branch='main';state.date='2026-09-18';state.type='all';state.status='attention';state.run='MDVP-78421';state.mode='ready';normalizeSelection();render();break;
 case 'export':exportInvestigation();break;
 case 'csv':downloadCSV();break;
 case 'copy-sha':copyText(lookup.get(Number(el.dataset.seq)).sha);break;
 case 'manifest':{const seq=Number(el.dataset.seq),x=lookup.get(seq);download(`SMP1900-main-E1-S${seq}-manifest.json`,JSON.stringify({data_classification:'SYNTHETIC_DEMO_ONLY',...canonical(seq),product:'SMP1900',artifact_available:x.artifact,artifact_sha256:x.artifact?x.digest:null,build_id:x.build},null,2),'application/json');break;}
 case 'run-json':if(r)download(r.id+'-demo.json',JSON.stringify({data_classification:'SYNTHETIC_DEMO_ONLY',run:r},null,2),'application/json');break;
 case 'handoff':download('CLAUDE_REGRESSION_UI_BRIEF.md',handoffText(),'text/markdown;charset=utf-8');toast('Claude 구현 지시서를 저장했습니다.');break;
 case 'search-scope':modal('Search와 Regression의 경계',`<p>Search는 기존 PR / SHA / M-number 조회 메뉴로 유지합니다. 이 시제품은 독립 Regression 메뉴의 UI 후보만 다룹니다.</p><div class="explanation">실제 pr-search Search 화면을 복제하거나 교체하지 않았습니다. 현재 파일에서 이 버튼은 메뉴 위치와 경계를 설명합니다.</div>`);break;
 case 'start':startSession();break;
 case 'mark':mark(el.dataset.verdict);break;
 case 'confirm-mark':mark(el.dataset.verdict,$('#verdict-reason').value,$('#verdict-note').value);break;
 case 'undo':if(s?.snapshots.length&&available()){const snap=s.snapshots.pop();Object.assign(s,snap);state.page=1;render();toast('직전 판정을 취소했습니다.');}break;
 case 'session-reset':if(s&&available())modal('이 세션을 초기화할까요?',`<p>${r.id}의 로컬 판정 ${s.history.length}개를 지우고 원래 PASS/FAIL 범위로 돌아갑니다. 다른 시험의 세션은 유지됩니다.</p>`,{footer:btn('취소','close-modal')+btn('세션 초기화','confirm-session-reset','','primary')});break;
 case 'confirm-session-reset':if(r&&available()){delete state.sessions[r.id];closeModal();render();toast('선택한 로컬 세션을 초기화했습니다.');}break;
 case 'session-log':sessionLog();break;
 case 'defer':if(s?.waiting&&available()){if(!s.deferred.includes(s.waiting))s.deferred.push(s.waiting);s.waiting=null;render();toast('경계는 유지하고 다른 후보를 제시합니다.');}break;
 case 'request':requestModal();break;
 case 'confirm-request':if(r&&available()){state.queue.push({id:'DEMO-TEST-'+(state.queue.length+1),kind:'test',run:r.id,seq:Number(el.dataset.seq),signature:r.signature,environment:r.environment,config:r.config,state:'LOCAL_DEMO_QUEUE',canonical:canonical(Number(el.dataset.seq))});closeModal();render();toast('로컬 요청 큐에 추가했습니다. 실제 MDVP는 호출하지 않았습니다.');}break;
 case 'build-request':if(available()){state.queue.push({id:'DEMO-BUILD-'+(state.queue.length+1),kind:'build',run:r?.id,seq:Number(el.dataset.seq),state:'LOCAL_DEMO_QUEUE'});save();toast('재빌드 요청을 로컬 데모 큐에 기록했습니다. 실제 빌드는 실행되지 않습니다.');}break;
 case 'queue':modal('로컬 요청 큐',`<p>외부 테스트/빌드 실행 없이 요청 UI만 재현합니다.</p><div class="results-list">${state.queue.map(q=>`<div class="result-item"><div><span class="mono">${q.id} · ${rev(q.seq)}</span><p class="tiny">${q.kind} · ${q.run||'—'}</p></div><span class="badge outline">DEMO</span></div>`).join('')||'<div class="explanation">요청 기록이 없습니다.</div>'}</div>`);break;
 case 'reset-all':modal('모든 데모 기록 초기화',`<p>이 브라우저에 저장한 로컬 판정과 요청 큐만 초기화합니다. 실제 서비스에는 영향을 주지 않습니다.</p>`,{footer:btn('취소','close-modal')+btn('모든 로컬 기록 삭제','confirm-reset-all','','primary')});break;
 case 'confirm-reset-all':state.sessions={};state.queue=[];state.mode='ready';state.pulseStep=2;closeModal();render();toast('로컬 데모 기록을 초기화했습니다.');break;
 case 'zoom':state.zoom=Math.max(1,Math.min(4,state.zoom+Number(el.dataset.delta)));render();break;
 case 'map-focus':state.focusRange=!state.focusRange;state.zoom=1;render();break;
 case 'matrix':state.date=el.dataset.date;state.type=el.dataset.type;state.status=el.dataset.status==='PASS'?'all':'attention';normalizeSelection();state.pulseStep=getSession()?3:2;render();break;
 case 'daily-all':state.type='all';state.status='attention';normalizeSelection();render();break;
 case 'step':{const step=Number(el.dataset.step);if(step===1){$('.daily-failures')?.scrollIntoView({block:'nearest'});$('.daily-failures .run-card')?.focus();}else if(step===3){startSession();}else{state.pulseStep=2;render();}break;}
 }
}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(el)eventAction(el);});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('tr[data-action],g[data-action]')){e.preventDefault();eventAction(e.target);}});
document.addEventListener('change',e=>{if(e.target.id==='date'){state.date=e.target.value;normalizeSelection();render();}else if(e.target.id==='branch'){state.branch=e.target.value;render();}else if(e.target.id==='run-select'){selectRun(e.target.value);}});
document.addEventListener('input',e=>{if(e.target.id==='table-query'){state.query=e.target.value;state.page=1;render();}});
$('#modal').addEventListener('click',e=>{if(e.target===$('#modal')){const box=e.target.getBoundingClientRect();if(e.clientX<box.left||e.clientX>box.right||e.clientY<box.top||e.clientY>box.bottom)closeModal();}});
$('#modal').addEventListener('close',()=>{if(returnFocus?.isConnected)returnFocus.focus({preventScroll:true});});
render();
// Explicit test hooks expose only synthetic local state, never production credentials.
window.__prototypeTest={getState:()=>state,calculate,changes,canonical,lookup,findRun,render};
</script></body></html>
